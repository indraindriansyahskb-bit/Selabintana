<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Manajemen Stok Barang</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 30px 15px; line-height: 1.5; }
    .wrapper { max-width: 1200px; margin: auto; }
    .app-header { text-align: center; margin-bottom: 25px; }
    .app-header h2 { font-size: 26px; font-weight: 700; color: #1e293b; margin: 0 0 6px 0; }
    .app-header p { font-size: 14px; color: var(--text-muted); margin: 0; }
    .card { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color); margin-bottom: 25px; }
    .section-title { font-size: 16px; font-weight: 600; color: #1e293b; margin-top: 0; margin-bottom: 18px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13px; color: #334155; }
    input[type="text"], input[type="password"], select, input[type="number"] {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 13px; font-family: inherit;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2,132,199,0.15); }
    .row-group { display: flex; gap: 16px; flex-wrap: wrap; }
    .row-group .form-group { flex: 1; min-width: 180px; }
    button { background-color: var(--primary); color: white; padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
    button:hover { background-color: var(--primary-hover); }
    .user-info-box { background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); border: 1px solid #7dd3fc; padding: 14px 18px; border-radius: 10px; margin-bottom: 22px; font-size: 14px; color: #0369a1; display: flex; justify-content: space-between; align-items: center; }
    .logout-btn { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; padding: 6px 12px; font-size: 12px; }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 22px; }
    .stat-card { background: #fff; border: 1px solid var(--border-color); padding: 18px; border-radius: 10px; display: flex; align-items: center; gap: 16px; }
    .stat-icon { width: 48px; height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .stat-card .val { font-size: 22px; font-weight: 700; color: #0f172a; margin-top: 4px; }
    .stat-card label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin: 0; }
    .stat-card.total .stat-icon { background: #e0f2fe; color: var(--primary); }
    .stat-card.warning .stat-icon { background: #fef3c7; color: var(--warning); }
    .stat-card.danger .stat-icon { background: #fee2e2; color: var(--danger); }
    .filter-card { background: #f8fafc; border: 1px solid var(--border-color); padding: 16px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .table-responsive { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-color); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; text-align: left; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    th { background-color: #f8fafc; font-weight: 600; color: #475569; font-size: 12px; text-transform: uppercase; }
    tr:hover { background-color: #f8fafc; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-ok { background: #d1fae5; color: #047857; }
    .badge-warning { background: #fee2e2; color: #b91c1c; }
    .btn-sm { padding: 6px 10px; font-size: 11px; margin-right: 4px; border-radius: 6px; }
    .btn-in { background-color: #10b981; }
    .btn-out { background-color: #f59e0b; }

    /* Modal Styling */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto; padding: 20px; }
    .modal-content { background: white; max-width: 500px; margin: 50px auto; padding: 25px; border-radius: 12px; }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="app-header">
    <h2><i class="fa-solid fa-warehouse" style="color: var(--primary);"></i> Sistem Manajemen Stok Gudang</h2>
    <p>Terintegrasi dengan Database User Portal Permintaan Barang</p>
  </div>

  <!-- Login Section -->
  <div id="loginSection" class="card" style="max-width: 400px; margin: 40px auto;">
    <h3 class="section-title"><i class="fa-solid fa-right-to-bracket"></i> Login Aplikasi Stok</h3>
    <div class="form-group"><label>Username</label><input type="text" id="loginUser" placeholder="Masukkan username..." required></div>
    <div class="form-group"><label>Password</label><input type="password" id="loginPass" placeholder="Masukkan password..." required></div>
    <button type="button" onclick="prosesLogin()" style="width:100%; margin-top: 10px; padding: 12px;"><i class="fa-solid fa-sign-in-alt"></i> Masuk</button>
    <div id="loginLoading" style="display:none; text-align:center; margin-top:14px; font-size:13px; color:var(--primary);"><i class="fa-solid fa-circle-notch fa-spin"></i> Memeriksa data user...</div>
  </div>

  <!-- Main Panel App -->
  <div id="mainPanel" style="display: none;">
    <div class="user-info-box" id="infoSesiUser"></div>

    <!-- Summary Cards -->
    <div class="summary-grid">
      <div class="stat-card total"><div class="stat-icon"><i class="fa-solid fa-boxes-stacked"></i></div><div><label>Total Jenis Barang</label><div class="val" id="statTotalJenis">0</div></div></div>
      <div class="stat-card warning"><div class="stat-icon"><i class="fa-solid fa-cubes"></i></div><div><label>Total Sisa Stok</label><div class="val" id="statTotalStok">0</div></div></div>
      <div class="stat-card danger"><div class="stat-icon"><i class="fa-solid fa-triangle-exclamation"></i></div><div><label>Stok Menipis / Kritis</label><div class="val" id="statStokKritis">0</div></div></div>
    </div>

    <!-- Inventory Data Table -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 class="section-title" style="margin: 0; border: none; padding: 0;"><i class="fa-solid fa-list-check"></i> Monitoring Data Stok Barang</h3>
        <button onclick="bukaModalTambah()" id="btnTambahBarang" style="background: #059669; display: none;"><i class="fa-solid fa-plus"></i> Tambah Barang Baru</button>
      </div>

      <div class="filter-card">
        <div style="flex:1; min-width:160px;"><label>Filter Kategori:</label>
          <select id="filterKategori" onchange="terapkanFilterStok()">
            <option value="">-- Semua Kategori --</option>
            <option value="OBAT">OBAT</option>
            <option value="VAKSIN">VAKSIN</option>
            <option value="VITAMIN">VITAMIN</option>
            <option value="KIMIA">KIMIA</option>
            <option value="PERALATAN">PERALATAN</option>
            <option value="PAKAN">PAKAN</option>
            <option value="LAINNYA">LAINNYA</option>
          </select>
        </div>
        <div style="flex:2; min-width:200px;"><label>Cari Barang / Kode:</label><input type="text" id="searchStok" placeholder="Ketik kata kunci..." onkeyup="terapkanFilterStok()"></div>
      </div>

      <div class="table-responsive" id="containerTabelStok">
        <p style="text-align:center; padding:20px; color:var(--text-muted);">Memuat data stok...</p>
      </div>
    </div>
  </div>
</div>

<!-- MODAL TAMBAH BARANG BARU -->
<div id="modalTambah" class="modal">
  <div class="modal-content">
    <h3 class="section-title"><i class="fa-solid fa-box"></i> Tambah Barang Ke Inventaris Stok</h3>
    <form id="formTambahBarang">
      <div class="form-group"><label>Nama Barang</label><input type="text" id="tambahNama" required></div>
      <div class="row-group">
        <div class="form-group"><label>Kategori</label>
          <select id="tambahKategori" required>
            <option value="OBAT">OBAT</option>
            <option value="VAKSIN">VAKSIN</option>
            <option value="VITAMIN">VITAMIN</option>
            <option value="KIMIA">KIMIA</option>
            <option value="PERALATAN">PERALATAN</option>
            <option value="PAKAN">PAKAN</option>
            <option value="LAINNYA">LAINNYA</option>
          </select>
        </div>
        <div class="form-group"><label>Satuan</label><input type="text" id="tambahSatuan" placeholder="pcs/kg/liter" required></div>
      </div>
      <div class="row-group">
        <div class="form-group"><label>Stok Awal</label><input type="number" id="tambahStokAwal" min="0" value="0" required></div>
        <div class="form-group"><label>Stok Minimum</label><input type="number" id="tambahStokMin" min="1" value="5" required></div>
      </div>
      <div class="form-group"><label>Lokasi Gudang</label><input type="text" id="tambahLokasi" value="Gudang Utama"></div>
      <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
        <button type="button" onclick="tutupModalTambah()" style="background:#64748b;">Batal</button>
        <button type="submit">Simpan Barang</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL MUTASI STOK (BARANG MASUK / KELUAR) -->
<div id="modalMutasi" class="modal">
  <div class="modal-content">
    <h3 class="section-title" id="mutasiTitle"><i class="fa-solid fa-right-left"></i> Transaksi Stok</h3>
    <form id="formMutasiStok">
      <input type="hidden" id="mutasiKodeBarang">
      <input type="hidden" id="mutasiTipe">
      <div class="form-group"><label>Barang</label><input type="text" id="mutasiNamaBarang" readonly style="background:#f1f5f9;"></div>
      <div class="form-group"><label>Jumlah Mutasi</label><input type="number" id="mutasiJumlah" min="1" required></div>
      <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
        <button type="button" onclick="tutupModalMutasi()" style="background:#64748b;">Batal</button>
        <button type="submit" id="btnSubmitMutasi">Proses</button>
      </div>
    </form>
  </div>
</div>

<script>
  // Ganti dengan URL Apps Script Anda
  const GAS_URL = "https://script.google.com/macros/s/AKfycbw6msj-_8KlMWw97-efAZZwcf91NJt7yFMuMqIJTXz2Sc2pKmK1eFp4OqKlGozF2OyYMQ/exec";

  let sesiUser = {};
  let rawStokData = [];

  window.onload = function() {
    const savedUser = localStorage.getItem('stok_app_user_session');
    if (savedUser) { sesiUser = JSON.parse(savedUser); tampilkanDashboard(); }
  };

  async function prosesLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    const loading = document.getElementById('loginLoading');
    if (!username || !password) { alert("Masukkan Username dan Password!"); return; }
    loading.style.display = "block";
    try {
      const res = await fetch(`${GAS_URL}?action=login&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
      const result = await res.json();
      if (result.status === "success") {
        sesiUser = result.userData;
        localStorage.setItem('stok_app_user_session', JSON.stringify(sesiUser));
        tampilkanDashboard();
      } else { alert("Login Gagal: " + result.message); }
    } catch (err) { alert("Terjadi kesalahan koneksi."); }
    finally { loading.style.display = "none"; }
  }

  function tampilkanDashboard() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('mainPanel').style.display = 'block';
    document.getElementById('infoSesiUser').innerHTML = `
      <div><b>Pengguna: ${sesiUser.nama}</b> (${sesiUser.jabatan} | ${sesiUser.unitLokasi})</div>
      <button onclick="logoutSesi()" class="logout-btn">Keluar</button>
    `;

    if (sesiUser.isAdmin) {
      document.getElementById('btnTambahBarang').style.display = 'inline-flex';
    }

    muatDataStok();
  }

  function logoutSesi() { localStorage.removeItem('stok_app_user_session'); location.reload(); }

  async function muatDataStok() {
    try {
      const res = await fetch(GAS_URL + "?action=getStokBarang");
      const json = await res.json();
      if (json.status === "success") {
        rawStokData = json.data;
        terapkanFilterStok();
      }
    } catch(e) { document.getElementById('containerTabelStok').innerHTML = "Gagal memuat data stok."; }
  }

  function terapkanFilterStok() {
    const kat = document.getElementById('filterKategori').value;
    const search = document.getElementById('searchStok').value.toLowerCase().trim();

    let filtered = rawStokData.filter(item => {
      if (kat && item.kategori !== kat) return false;
      if (search && !item.namaBarang.toLowerCase().includes(search) && !item.kodeBarang.toLowerCase().includes(search)) return false;
      return true;
    });

    renderStatistik(filtered);
    renderTabelStok(filtered);
  }

  function renderStatistik(data) {
    document.getElementById('statTotalJenis').innerText = data.length;
    let totalSisa = data.reduce((acc, curr) => acc + curr.sisaStok, 0);
    document.getElementById('statTotalStok').innerText = totalSisa;
    let kritis = data.filter(i => i.sisaStok <= i.stokMin).length;
    document.getElementById('statStokKritis').innerText = kritis;
  }

  function renderTabelStok(data) {
    if (data.length === 0) {
      document.getElementById('containerTabelStok').innerHTML = "<p style='text-align:center; padding:20px; color:var(--text-muted);'>Tidak ada data barang.</p>";
      return;
    }

    let html = `<table><thead><tr>
      <th>Kode Barang</th>
      <th>Nama Barang</th>
      <th>Kategori</th>
      <th>Lokasi</th>
      <th>Stok Masuk / Keluar</th>
      <th>Sisa Stok Saat Ini</th>
      <th>Status</th>
      <th>Aksi Stok</th>
    </tr></thead><tbody>`;

    data.forEach(item => {
      let isMenipis = item.sisaStok <= item.stokMin;
      let badgeHtml = isMenipis 
        ? `<span class="badge badge-warning"><i class="fa-solid fa-triangle-exclamation"></i> Menipis (Min: ${item.stokMin})</span>`
        : `<span class="badge badge-ok"><i class="fa-solid fa-circle-check"></i> Aman</span>`;

      html += `<tr>
        <td><b>${item.kodeBarang}</b></td>
        <td><b>${item.namaBarang}</b></td>
        <td>${item.kategori}</td>
        <td>${item.lokasi}</td>
        <td><small style="color:#059669;">+${item.stokMasuk}</small> / <small style="color:#dc2626;">-${item.stokKeluar}</small></td>
        <td style="font-size:15px; font-weight:700; color:${isMenipis ? '#dc2626' : '#0284c7'};">${item.sisaStok} ${item.satuan}</td>
        <td>${badgeHtml}</td>
        <td>
          <button class="btn-sm btn-in" onclick="bukaModalMutasi('${item.kodeBarang}', '${item.namaBarang}', 'MASUK')"><i class="fa-solid fa-plus"></i> Masuk</button>
          <button class="btn-sm btn-out" onclick="bukaModalMutasi('${item.kodeBarang}', '${item.namaBarang}', 'KELUAR')"><i class="fa-solid fa-minus"></i> Keluar</button>
        </td>
      </tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById('containerTabelStok').innerHTML = html;
  }

  function bukaModalTambah() { document.getElementById('modalTambah').style.display = 'block'; }
  function tutupModalTambah() { document.getElementById('modalTambah').style.display = 'none'; }

  document.getElementById('formTambahBarang').addEventListener('submit', async function(e) {
    e.preventDefault();
    const payload = {
      action: "tambahBarangStok",
      namaBarang: document.getElementById('tambahNama').value.trim(),
      kategori: document.getElementById('tambahKategori').value,
      satuan: document.getElementById('tambahSatuan').value.trim(),
      stokAwal: document.getElementById('tambahStokAwal').value,
      stokMin: document.getElementById('tambahStokMin').value,
      lokasi: document.getElementById('tambahLokasi').value.trim()
    };

    try {
      const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
      const json = await res.json();
      if(json.status === "success") {
        alert("Barang baru tersimpan!");
        tutupModalTambah();
        document.getElementById('formTambahBarang').reset();
        muatDataStok();
      }
    } catch(err) { alert("Kesalahan koneksi."); }
  });

  function bukaModalMutasi(kode, nama, tipe) {
    document.getElementById('mutasiKodeBarang').value = kode;
    document.getElementById('mutasiNamaBarang').value = nama;
    document.getElementById('mutasiTipe').value = tipe;
    document.getElementById('mutasiJumlah').value = "";
    document.getElementById('mutasiTitle').innerHTML = tipe === 'MASUK' 
      ? `<i class="fa-solid fa-circle-arrow-down" style="color:#10b981;"></i> Catat Barang Masuk`
      : `<i class="fa-solid fa-circle-arrow-up" style="color:#f59e0b;"></i> Catat Barang Keluar`;
    document.getElementById('btnSubmitMutasi').style.background = tipe === 'MASUK' ? '#10b981' : '#f59e0b';
    document.getElementById('modalMutasi').style.display = 'block';
  }

  function tutupModalMutasi() { document.getElementById('modalMutasi').style.display = 'none'; }

  document.getElementById('formMutasiStok').addEventListener('submit', async function(e) {
    e.preventDefault();
    const payload = {
      action: "updateMutasiStok",
      kodeBarang: document.getElementById('mutasiKodeBarang').value,
      tipeMutasi: document.getElementById('mutasiTipe').value,
      jumlah: document.getElementById('mutasiJumlah').value
    };

    try {
      const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
      const json = await res.json();
      if(json.status === "success") {
        alert("Stok berhasil diperbarui!");
        tutupModalMutasi();
        muatDataStok();
      }
    } catch(err) { alert("Kesalahan koneksi."); }
  });
</script>

</body>
</html>
