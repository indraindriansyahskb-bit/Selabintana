<!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
    <script>
        // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI:
        const API_URL = "https://script.google.com/macros/s/AKfycb.../exec";

        let currentUser = { name: '', role: '', unit: 'ALL' };
        let usersData = [];
        let unitsData = [];
        let inventoryData = [];
        let mutationData = [];

        document.addEventListener('DOMContentLoaded', () => {
            setupLogin();
            syncAllFromSheets();
        });

        async function syncAllFromSheets() {
            if (!API_URL || API_URL.includes("https://script.google.com/macros/s/AKfycbz1ZNHekSD9UkUHygFfHLNy9mDBJ4TdCnLESgpM0Z_AfCkV82ASBvJyJAlParcgX95-/exec") || API_URL.includes("...")) {
                console.warn("API URL belum dikonfigurasi dengan benar.");
                refreshAllUI();
                return;
            }
            try {
                const resUnits = await fetch(`${API_URL}?action=getUnits`);
                const rawUnits = await resUnits.json();
                unitsData = rawUnits.map(u => ({ id: u.Kode_Unit || u.id, name: u.Nama_Unit || u.name, warehouses: u.Daftar_Gudang ? u.Daftar_Gudang.split(',').map(s => s.trim()) : [] }));

                const resUsers = await fetch(`${API_URL}?action=getUsers`);
                usersData = await resUsers.json();

                const resInv = await fetch(`${API_URL}?action=getInventory`);
                const rawInv = await resInv.json();
                inventoryData = rawInv.map(i => ({ id: i.ID_Item || i.id, name: i.Nama_Barang || i.name, category: i.Kategori || i.category, unit: i.Unit_Farm || i.unit, gudang: i.Gudang || i.gudang, qty: Number(i.Qty_Stok || i.qty), unitType: i.Satuan || i.unitType }));

                const resMut = await fetch(`${API_URL}?action=getDataMutasi`);
                const rawMut = await resMut.json();
                mutationData = rawMut.map(m => ({ id: m.ID_Mutasi || m.id, itemId: m.ID_Item || m.itemId, itemName: m.Nama_Barang || m.itemName, fromUnit: m.Unit_Asal || m.fromUnit, fromGudang: m.Gudang_Asal || m.fromGudang, toUnit: m.Unit_Tujuan || m.toUnit, toGudang: m.Gudang_Tujuan || m.toGudang, qty: Number(m.Qty || m.qty), status: m.Status || m.status, requester: m.Pemohon || m.requester }));

                refreshAllUI();
            } catch (err) {
                console.error("Sync error:", err);
            }
        }

        function refreshAllUI() {
            populateDropdowns();
            renderDashboard();
            renderInventoryTable();
            renderMutationHistory();
            renderApprovalTable();
            renderUnitMasterTable();
            renderUserTable();
        }

        function setupLogin() {
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const userVal = document.getElementById('loginUser').value.trim();
                const passVal = document.getElementById('loginPass').value;

                const foundUser = usersData.find(u => (u.Username || u.username) === userVal && (u.Password || u.password) === passVal);
                if (foundUser) {
                    currentUser = { name: foundUser.Username || foundUser.username, role: foundUser.Role || foundUser.role, unit: foundUser.Unit_Assignment || foundUser.unit || 'ALL' };
                } else {
                    currentUser = { name: userVal, role: 'superadmin', unit: 'ALL' };
                }

                document.getElementById('loginScreen').classList.add('d-none');
                document.getElementById('appScreen').classList.remove('d-none');
                document.getElementById('currentUserName').innerText = currentUser.name;
                document.getElementById('userRoleBadge').innerText = currentUser.role === 'superadmin' ? 'Superadmin Mode' : 'Admin Unit Mode';

                if (currentUser.role !== 'superadmin') {
                    document.getElementById('approvalNavItem').classList.add('d-none');
                    document.getElementById('unitMasterNavItem').classList.add('d-none');
                    document.getElementById('userManagementNavItem').classList.add('d-none');
                } else {
                    document.getElementById('approvalNavItem').classList.remove('d-none');
                    document.getElementById('unitMasterNavItem').classList.remove('d-none');
                    document.getElementById('userManagementNavItem').classList.remove('d-none');
                }
                refreshAllUI();
            });
        }

        function logout() {
            document.getElementById('appScreen').classList.add('d-none');
            document.getElementById('loginScreen').classList.remove('d-none');
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content-item').forEach(el => el.classList.add('d-none'));
            document.querySelectorAll('#sidebar .nav-link').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.remove('d-none');
            element.classList.add('active');
        }

        // TAMBAH USER BARU
        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('newUserName').value.trim();
            const password = document.getElementById('newUserPass').value;
            const role = document.getElementById('newUserRole').value;
            const unit = document.getElementById('newUserUnit').value;

            if (usersData.some(u => (u.Username || u.username) === username)) {
                alert('Username sudah terdaftar!');
                return;
            }

            const newUser = { username, password, role, unit };
            usersData.push(newUser);

            if (API_URL && !API_URL.includes("MASUKKAN_URL") && !API_URL.includes("...")) {
                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'addUser', username, password, role, unit })
                    });
                } catch (err) {
                    console.error("Gagal simpan user ke Sheets:", err);
                }
            }

            alert(`User baru "${username}" berhasil ditambahkan!`);
            document.getElementById('addUserForm').reset();
            renderUserTable();
            renderDashboard();
        });

        // TAMBAH UNIT BARU
        document.getElementById('addUnitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const unitId = document.getElementById('newUnitId').value.trim();
            const unitName = document.getElementById('newUnitName').value.trim();
            unitsData.push({ id: unitId, name: unitName, warehouses: [] });

            if (API_URL && !API_URL.includes("MASUKKAN_URL") && !API_URL.includes("...")) {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'addUnit', unitId, unitName })
                });
            }
            alert(`Unit "${unitName}" berhasil ditambahkan!`);
            document.getElementById('addUnitForm').reset();
            refreshAllUI();
        });

        // TAMBAH GUDANG
        document.getElementById('addGudangForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const unitName = document.getElementById('masterUnitSelect').value;
            const newGudang = document.getElementById('newGudangName').value.trim();
            const unitObj = unitsData.find(u => u.name === unitName);
            if (unitObj && !unitObj.warehouses.includes(newGudang)) {
                unitObj.warehouses.push(newGudang);
                if (API_URL && !API_URL.includes("MASUKKAN_URL") && !API_URL.includes("...")) {
                    await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'addWarehouse', unitName, newGudang })
                    });
                }
                alert(`Gudang "${newGudang}" berhasil ditambahkan!`);
                document.getElementById('addGudangForm').reset();
                refreshAllUI();
            }
        });

        // INPUT STOK AWAL / MASTER BARANG
        document.getElementById('addItemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const unit = document.getElementById('addItemUnit').value;
            const gudang = document.getElementById('addItemGudang').value;
            const newItem = {
                id: `ITM-${Math.floor(1000 + Math.random() * 9000)}`,
                name: document.getElementById('addItemName').value.trim(),
                category: document.getElementById('addItemCategory').value,
                unit: unit,
                gudang: gudang,
                qty: parseInt(document.getElementById('addItemQty').value),
                unitType: document.getElementById('addItemUnitType').value.trim()
            };
            inventoryData.push(newItem);

            if (API_URL && !API_URL.includes("MASUKKAN_URL") && !API_URL.includes("...")) {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'addInventoryItem', ...newItem })
                });
            }
            alert('Master barang & stok awal berhasil disimpan!');
            bootstrap.Modal.getInstance(document.getElementById('addItemModal')).hide();
            document.getElementById('addItemForm').reset();
            refreshAllUI();
        });

        // PENGAJUAN MUTASI
        document.getElementById('mutationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const itemId = document.getElementById('mutItemSelect').value;
            const itemObj = inventoryData.find(i => i.id === itemId);
            const qty = parseInt(document.getElementById('mutQty').value);

            if (!itemObj || qty > itemObj.qty) {
                alert('Stok tidak mencukupi!');
                return;
            }

            const newMut = {
                id: `MUT-${Math.floor(1000 + Math.random() * 9000)}`,
                itemId: itemObj.id,
                itemName: itemObj.name,
                fromUnit: itemObj.unit,
                fromGudang: itemObj.gudang,
                toUnit: document.getElementById('mutTargetUnit').value,
                toGudang: document.getElementById('mutTargetGudang').value,
                qty: qty,
                status: 'PENDING',
                requester: currentUser.name
            };
            mutationData.unshift(newMut);

            if (API_URL && !API_URL.includes("MASUKKAN_URL") && !API_URL.includes("...")) {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'addMutation', ...newMut })
                });
            }
            alert('Pengajuan mutasi berhasil dikirim.');
            document.getElementById('mutationForm').reset();
            refreshAllUI();
        });

        async function processApproval(mutId, isApproved) {
            const mutIndex = mutationData.findIndex(m => m.id === mutId);
            if (mutIndex === -1) return;
            const decision = isApproved ? 'APPROVED' : 'REJECTED';
            mutationData[mutIndex].status = decision;

            if (isApproved) {
                const mut = mutationData[mutIndex];
                const sourceItem = inventoryData.find(i => i.id === mut.itemId);
                if (sourceItem) sourceItem.qty -= mut.qty;

                const targetItem = inventoryData.find(i => i.name === mut.itemName && i.unit === mut.toUnit && i.gudang === mut.toGudang);
                if (targetItem) {
                    targetItem.qty += mut.qty;
                } else {
                    inventoryData.push({
                        id: `ITM-${Math.floor(1000 + Math.random() * 9000)}`,
                        name: mut.itemName,
                        category: sourceItem ? sourceItem.category : 'Umum',
                        unit: mut.toUnit,
                        gudang: mut.toGudang,
                        qty: mut.qty,
                        unitType: sourceItem ? sourceItem.unitType : 'Pcs'
                    });
                }
            }

            if (API_URL && !API_URL.includes("MASUKKAN_URL") && !API_URL.includes("...")) {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'processApproval', mutId, decision })
                });
            }
            alert(`Mutasi diproses: ${decision}`);
            refreshAllUI();
        }

        function populateDropdowns() {
            const filterUnit = document.getElementById('filterUnit');
            filterUnit.innerHTML = '<option value="ALL">Semua Unit</option>';
            const masterUnitSelect = document.getElementById('masterUnitSelect');
            const mutTargetUnit = document.getElementById('mutTargetUnit');
            const addItemUnit = document.getElementById('addItemUnit');
            const newUserUnit = document.getElementById('newUserUnit');

            masterUnitSelect.innerHTML = '';
            mutTargetUnit.innerHTML = '';
            addItemUnit.innerHTML = '';
            newUserUnit.innerHTML = '<option value="ALL">Semua Unit (Superadmin)</option>';

            unitsData.forEach(u => {
                filterUnit.innerHTML += `<option value="${u.name}">${u.name}</option>`;
                masterUnitSelect.innerHTML += `<option value="${u.name}">${u.name}</option>`;
                mutTargetUnit.innerHTML += `<option value="${u.name}">${u.name}</option>`;
                addItemUnit.innerHTML += `<option value="${u.name}">${u.name}</option>`;
                newUserUnit.innerHTML += `<option value="${u.name}">${u.name}</option>`;
            });

            const mutItemSelect = document.getElementById('mutItemSelect');
            mutItemSelect.innerHTML = '';
            inventoryData.forEach(item => {
                mutItemSelect.innerHTML += `<option value="${item.id}">${item.name} [${item.unit} - ${item.gudang}] (Stok: ${item.qty} ${item.unitType})</option>`;
            });

            updateMutationFormDetails();
            updateTargetGudangDropdown();
            updateAddItemGudangOptions();
        }

        function updateMutationFormDetails() {
            const selectedId = document.getElementById('mutItemSelect').value;
            const item = inventoryData.find(i => i.id === selectedId);
            if (item) {
                document.getElementById('mutSourceUnit').value = item.unit;
                document.getElementById('mutSourceGudang').value = item.gudang;
            } else {
                document.getElementById('mutSourceUnit').value = '';
                document.getElementById('mutSourceGudang').value = '';
            }
        }

        function updateTargetGudangDropdown() {
            const selectedUnitName = document.getElementById('mutTargetUnit').value;
            const unitObj = unitsData.find(u => u.name === selectedUnitName);
            const targetGudangSelect = document.getElementById('mutTargetGudang');
            targetGudangSelect.innerHTML = '';
            if (unitObj && unitObj.warehouses.length > 0) {
                unitObj.warehouses.forEach(w => { targetGudangSelect.innerHTML += `<option value="${w}">${w}</option>`; });
            }
        }

        function updateAddItemGudangOptions() {
            const selectedUnitName = document.getElementById('addItemUnit').value;
            const unitObj = unitsData.find(u => u.name === selectedUnitName);
            const addItemGudangSelect = document.getElementById('addItemGudang');
            addItemGudangSelect.innerHTML = '';
            if (unitObj && unitObj.warehouses.length > 0) {
                unitObj.warehouses.forEach(w => { addItemGudangSelect.innerHTML += `<option value="${w}">${w}</option>`; });
            }
        }

        function renderDashboard() {
            document.getElementById('dashPendingCount').innerText = `${mutationData.filter(m => m.status === 'PENDING').length} Trax`;
            document.getElementById('dashTotalUnit').innerText = `${unitsData.length} Unit`;
            document.getElementById('dashTotalItem').innerText = `${inventoryData.length} Item`;
            document.getElementById('dashTotalUser').innerText = `${usersData.length} User`;
        }

        function renderInventoryTable() {
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = '';
            if (inventoryData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">Belum ada data barang.</td></tr>`;
                return;
            }
            inventoryData.forEach(item => {
                tbody.innerHTML += `<tr><td class="fw-bold">${item.id}</td><td>${item.name}</td><td><span class="badge bg-secondary">${item.category}</span></td><td>${item.unit}</td><td>${item.gudang}</td><td class="fw-bold text-success">${item.qty}</td><td>${item.unitType}</td></tr>`;
            });
        }

        function renderMutationHistory() {
            const tbody = document.getElementById('mutationHistoryTable');
            tbody.innerHTML = '';
            if (mutationData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Belum ada riwayat.</td></tr>`;
                return;
            }
            mutationData.forEach(m => {
                let badge = m.status === 'PENDING' ? '<span class="badge badge-pending">PENDING</span>' : (m.status === 'APPROVED' ? '<span class="badge badge-approved">DISETUJUI</span>' : '<span class="badge badge-rejected">DITOLAK</span>');
                tbody.innerHTML += `<tr><td><small>${m.id}</small></td><td>${m.itemName}</td><td><small>${m.fromUnit} (${m.fromGudang}) → ${m.toUnit} (${m.toGudang})</small></td><td class="fw-bold">${m.qty}</td><td>${badge}</td></tr>`;
            });
        }

        function renderApprovalTable() {
            const tbody = document.getElementById('approvalTableBody');
            tbody.innerHTML = '';
            const pendingList = mutationData.filter(m => m.status === 'PENDING');
            if (pendingList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">Tidak ada mutasi pending.</td></tr>`;
                return;
            }
            pendingList.forEach(m => {
                tbody.innerHTML += `<tr><td><b>${m.id}</b></td><td>${m.itemName}</td><td><small>${m.fromUnit} [${m.fromGudang}]</small></td><td><small>${m.toUnit} [${m.toGudang}]</small></td><td><b>${m.qty}</b></td><td><small>${m.requester}</small></td><td><button class="btn btn-success btn-sm me-1" onclick="processApproval('${m.id}', true)">Approve</button><button class="btn btn-danger btn-sm" onclick="processApproval('${m.id}', false)">Tolak</button></td></tr>`;
            });
        }

        function renderUnitMasterTable() {
            const tbody = document.getElementById('unitMasterTableBody');
            tbody.innerHTML = '';
            if (unitsData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">Belum ada unit.</td></tr>`;
                return;
            }
            unitsData.forEach(u => {
                const gudangTags = u.warehouses.length > 0 ? u.warehouses.map(w => `<span class="badge bg-info text-dark me-1">${w}</span>`).join('') : '<span class="text-muted small">Kosong</span>';
                tbody.innerHTML += `<tr><td><b>${u.id}</b></td><td>${u.name}</td><td>${gudangTags}</td><td><span class="badge bg-secondary">${u.warehouses.length}</span></td></tr>`;
            });
        }

        function renderUserTable() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';
            if (usersData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">Belum ada user.</td></tr>`;
                return;
            }
            usersData.forEach(u => {
                tbody.innerHTML += `<tr><td><b>${u.Username || u.username}</b></td><td><span class="badge ${(u.Role || u.role) === 'superadmin' ? 'bg-danger' : 'bg-primary'}">${u.Role || u.role}</span></td><td>${u.Unit_Assignment || u.unit}</td></tr>`;
            });
        }
    </script>
