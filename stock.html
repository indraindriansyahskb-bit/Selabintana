<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stok Multi Gudang - Peternakan Ayam</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root { --primary: #0284c7; --primary-hover: #0369a1; --bg-body: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border-color: #e2e8f0; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 25px 15px; }
    .wrapper { max-width: 1250px; margin: auto; }
    .app-header { text-align: center; margin-bottom: 25px; }
    .card { background: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color); margin-bottom: 22px; }
    .section-title { font-size: 16px; font-weight: 600; color: #1e293b; margin-top: 0; margin-bottom: 18px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13px; color: #334155; }
    input[type="text"], input[type="password"], select, input[type="number"] { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 13px; font-family: inherit; }
    .row-group { display: flex; gap: 14px; flex-wrap: wrap; }
    .row-group .form-group { flex: 1; min-width: 170px; }
    button { background-color: var(--primary); color: white; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    button:hover { background-color: var(--primary-hover); }
    .user-info-box { background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); border: 1px solid #7dd3fc; padding: 14px 18px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; color: #0369a1; display: flex; justify-content: space-between; align-items: center; }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 22px; }
    .stat-card { background: #fff; border: 1px solid var(--border-color); padding: 16px; border-radius: 10px; display: flex; align-items: center; gap: 14px; }
    .stat-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .stat-card .val { font-size: 20px; font-weight: 700; color: #0f172a; }
    .stat-card label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
    .stat-card.total .stat-icon { background: #e0f2fe; color: var(--primary); }
    .stat-card.warning .stat-icon { background: #fef3c7; color: var(--warning); }
    .stat-card.danger .stat-icon { background: #fee2e2; color: var(--danger); }
    .filter-card { background: #f8fafc; border: 1px solid var(--border-color); padding: 16px; border-radius: 10px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .table-responsive { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-color); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; text-align: left; }
    th, td { padding: 11px 13px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    th { background-color: #f8fafc; font-weight: 600; color: #475569; font-size: 11px; text-transform: uppercase; }
    .badge { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 15px; font-size: 11px; font-weight: 600; }
    .badge-ok { background: #d1fae5; color: #047857; }
    .badge-warning { background: #fee2e2; color: #b91c1c; }
    .btn-sm { padding: 5px 9px; font-size: 11px; border-radius: 6px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto; padding: 20px; }
    .modal-content { background: white; max-width: 520px; margin: 40px auto; padding: 22px; border-radius: 12px; }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="app-header">
    <h2><i class="fa-solid fa-warehouse" style="color: var(--primary);"></i> Management Stok Multi-Gudang</h2>
    <p>Unit Diambil Otomatis Dari Database Users</p>
  </div>

  <!-- Login Section -->
  <div id="loginSection" class="card" style="max-width: 380px; margin: 40px auto;">
    <h3 class="section-title"><i class="fa-solid fa-right-to-bracket"></i> Login App Stok</h3>
    <div class="form-group"><label>Username</label><input type="text" id="loginUser" required></div>
    <div class="form-group"><label>Password</label><input type="password" id="loginPass" required></div>
    <button type="button" onclick="prosesLogin()" style="width:100%; margin-top: 8px;"><i class="fa-solid fa-sign-in-alt"></i> Masuk</button>
  </div>

  <!-- Main Panel -->
  <div id="mainPanel" style="display: none;">
    <div class="user-info-box" id="infoSesiUser"></div>

    <div class="summary-grid">
      <div class="stat-card total"><div class="stat-icon"><i class="fa-solid fa-boxes-stacked"></i></div><div><label>Total Item Stok Unit</label><div class="val" id="statTotalJenis">0</div></div></div>
      <div class="stat-card warning"><div class="stat-icon"><i class="fa-solid fa-warehouse"></i></div><div><label>Unit Yang Dikelola</label><div class="val" id="statTotalUnit">0</div></div></div>
      <div class="stat-card danger"><div class="stat-icon"><i class="fa-solid fa-triangle-exclamation"></i></div><div><label>Stok Menipis</label><div class="val" id="statStokKritis">0</div></div></div>
    </div>

    <!-- Inventory Monitoring Card -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
        <h3 class="section-title" style="margin: 0; border: none;"><i class="fa-solid fa-boxes-packing"></i> Data Stok Barang Unit Anda</h3>
        <div id="actionGroup" style="display: flex; gap: 8px;">
          <button id="btnTambahGudang" onclick="bukaModalGudang()" style="background:#0891b2; display:none;"><i class="fa-solid fa-plus"></i> Tambah Gudang</button>
          <button onclick="bukaModalTambahBarang()" style="background:#059669;"><i class="fa-solid fa-plus"></i> Tambah Barang</button>
        </div>
      </div>

      <!-- Live Search & Filter -->
      <div class="filter-card">
        <div style="flex:1; min-width:160px;"><label>Unit / Farm:</label>
          <select id="filterUnit" onchange="onUnitFilterChange()">
            <option value="">-- Pilih Unit --</option>
          </select>
        </div>
        <div style="flex:1; min-width:160px;"><label>Gudang Spesifik:</label>
          <select id="filterGudang" onchange="terapkanFilterStok()">
            <option value="">-- Semua Gudang --</option>
          </select>
        </div>
        <div style="flex:2; min-width:220px;"><label><i class="fa-solid fa-magnifying-glass"></i> Cari Nama Barang:</label>
          <input type="text" id="searchStok" placeholder="Ketik nama barang..." onkeyup="terapkanFilterStok()">
        </div>
      </div>

      <div class="table-responsive" id="containerTabelStok"><p style="text-align:center; padding:20px;">Memuat data stok...</p></div>
    </div>
  </div>
</div>

<!-- MODAL TAMBAH GUDANG (KHUSUS ADMIN) -->
<div id="modalGudang" class="modal">
  <div class="modal-content">
    <h3 class="section-title">Tambah Gudang Pada Unit</h3>
    <form id="formTambahGudang">
      <div class="form-group"><label>Pilih Unit / Farm (Dari Data Users)</label><select id="gudangUnitPilih" required></select></div>
      <div class="form-group"><label>Nama Gudang</label><input type="text" id="namaGudangBaru" placeholder="Contoh: Gudang Obat / Gudang Pakan 1" required></div>
      <div style="display:flex; justify-content:flex-end; gap:8px;"><button type="button" onclick="tutupModal('modalGudang')" style="background:#64748b;">Batal</button><button type="submit">Simpan Gudang</button></div>
    </form>
  </div>
</div>

<!-- MODAL TAMBAH BARANG BARU -->
<div id="modalBarang" class="modal">
  <div class="modal-content">
    <h3 class="section-title">Tambah Barang Ke Gudang</h3>
    <form id="formTambahBarang">
      <div class="row-group">
        <div class="form-group"><label>Pilih Unit</label><select id="barangUnitPilih" onchange="updateSubGudangPilih('barangUnitPilih', 'barangGudangPilih')" required></select></div>
        <div class="form-group"><label>Pilih Gudang</label><select id="barangGudangPilih" required></select></div>
      </div>
      <div class="form-group"><label>Nama Barang</label><input type="text" id="tambahNama" required></div>
      <div class="row-group">
        <div class="form-group"><label>Kategori</label>
          <select id="tambahKategori" required>
            <option value="OBAT">OBAT</option><option value="VAKSIN">VAKSIN</option><option value="VITAMIN">VITAMIN</option>
            <option value="KIMIA">KIMIA</option><option value="PERALATAN">PERALATAN</option><option value="PAKAN">PAKAN</option><option value="LAINNYA">LAINNYA</option>
          </select>
        </div>
        <div class="form-group"><label>Satuan</label><input type="text" id="tambahSatuan" placeholder="pcs/kg/zak" required></div>
      </div>
      <div class="row-group">
        <div class="form-group"><label>Stok Awal</label><input type="number" id="tambahStokAwal" min="0" value="0" required></div>
        <div class="form-group"><label>Stok Minimum</label><input type="number" id="tambahStokMin" min="1" value="5" required></div>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;"><button type="button" onclick="tutupModal('modalBarang')" style="background:#64748b;">Batal</button><button type="submit">Simpan Barang</button></div>
    </form>
  </div>
</div>

<!-- MODAL MUTASI STOK -->
<div id="modalMutasi" class="modal">
  <div class="modal-content">
    <h3 class="section-title" id="mutasiTitle">Transaksi Mutasi Stok</h3>
    <form id="formMutasiStok">
      <input type="hidden" id="mutasiKodeBarang"><input type="hidden" id="mutasiTipe">
      <div class="form-group"><label>Nama Barang</label><input type="text" id="mutasiNamaBarang" readonly style="background:#f1f5f9;"></div>
      <div class="form-group"><label>Jumlah Mutasi</label><input type="number" id="mutasiJumlah" min="1" required></div>
      <div style="display:flex; justify-content:flex-end; gap:8px;"><button type="button" onclick="tutupModal('modalMutasi')" style="background:#64748b;">Batal</button><button type="submit" id="btnSubmitMutasi">Proses</button></div>
    </form>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbw6msj-_8KlMWw97-efAZZwcf91NJt7yFMuMqIJTXz2Sc2pKmK1eFp4OqKlGozF2OyYMQ/exec";

  let sesiUser = {};
  let masterUnits = [];
  let masterGudang = [];
  let rawStokData = [];

  window.onload = function() {
    const savedUser = localStorage.getItem('stok_app_user_session');
    if (savedUser) { sesiUser = JSON.parse(savedUser); tampilkanDashboard(); }
  };

  async function prosesLogin() {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value.trim();
    if (!u || !p) return alert("Masukkan Username & Password!");
    try {
      const res = await fetch(`${GAS_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`);
      const result = await res.json();
      if (result.status === "success") {
        sesiUser = result.userData;
        localStorage.setItem('stok_app_user_session', JSON.stringify(sesiUser));
        tampilkanDashboard();
      } else alert("Login Gagal: " + result.message);
    } catch (e) { alert("Kesalahan koneksi."); }
  }

  function tampilkanDashboard() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('mainPanel').style.display = 'block';
    document.getElementById('infoSesiUser').innerHTML = `
      <div><b>Pengguna: ${sesiUser.nama}</b> (${sesiUser.jabatan} | Unit: <b>${sesiUser.unitLokasi}</b>)</div>
      <button onclick="logoutSesi()" style="background:#fee2e2; color:#dc2626; border:1px solid #fca5a5; padding:5px 10px; font-size:12px;">Keluar</button>
    `;
    
    if (sesiUser.isAdmin) {
      document.getElementById('btnTambahGudang').style.display = 'inline-flex';
    }

    muatMetaUnitsGudang();
    muatDataStok();
  }

  function logoutSesi() { localStorage.removeItem('stok_app_user_session'); location.reload(); }

  async function muatMetaUnitsGudang() {
    try {
      const res = await fetch(`${GAS_URL}?action=getUnitsAndGudang&unitLokasi=${encodeURIComponent(sesiUser.unitLokasi)}&isAdmin=${sesiUser.isAdmin}`);
      const json = await res.json();
      if (json.status === "success") {
        masterUnits = json.units;
        masterGudang = json.gudang;
        populateUnitDropdowns();
      }
    } catch(e) {}
  }

  function populateUnitDropdowns() {
    const filterUnit = document.getElementById('filterUnit');
    const gudangUnitPilih = document.getElementById('gudangUnitPilih');
    const barangUnitPilih = document.getElementById('barangUnitPilih');

    if (sesiUser.isAdmin) {
      filterUnit.innerHTML = '<option value="">-- Semua Unit --</option>' + masterUnits.map(u => `<option value="${u.kodeUnit}">${u.namaUnit}</option>`).join('');
      let optHtml = '<option value="">-- Pilih Unit --</option>' + masterUnits.map(u => `<option value="${u.kodeUnit}">${u.namaUnit}</option>`).join('');
      if(gudangUnitPilih) gudangUnitPilih.innerHTML = optHtml;
      if(barangUnitPilih) barangUnitPilih.innerHTML = optHtml;
    } else {
      filterUnit.innerHTML = masterUnits.map(u => `<option value="${u.kodeUnit}">${u.namaUnit}</option>`).join('');
      filterUnit.disabled = true;
      if(barangUnitPilih) {
        barangUnitPilih.innerHTML = masterUnits.map(u => `<option value="${u.kodeUnit}">${u.namaUnit}</option>`).join('');
        barangUnitPilih.disabled = true;
      }
      onUnitFilterChange();
    }

    document.getElementById('statTotalUnit').innerText = masterUnits.length;
  }

  function onUnitFilterChange() {
    const selectedUnit = document.getElementById('filterUnit').value || (masterUnits[0] ? masterUnits[0].kodeUnit : '');
    const filterGudang = document.getElementById('filterGudang');
    
    let filteredGudang = masterGudang.filter(g => g.kodeUnit === selectedUnit);
    filterGudang.innerHTML = '<option value="">-- Semua Gudang --</option>' + filteredGudang.map(g => `<option value="${g.kodeGudang}">${g.namaGudang}</option>`).join('');
    
    if (document.getElementById('barangGudangPilih')) {
      updateSubGudangPilih('barangUnitPilih', 'barangGudangPilih');
    }
    
    terapkanFilterStok();
  }

  function updateSubGudangPilih(unitSelectId, gudangSelectId) {
    const unitKode = document.getElementById(unitSelectId).value;
    const gudangSelect = document.getElementById(gudangSelectId);
    let listG = masterGudang.filter(g => g.kodeUnit === unitKode);
    gudangSelect.innerHTML = listG.length > 0 
      ? listG.map(g => `<option value="${g.kodeGudang}">${g.namaGudang}</option>`).join('')
      : '<option value="">-- Tidak ada gudang --</option>';
  }

  async function muatDataStok() {
    try {
      const res = await fetch(`${GAS_URL}?action=getStokBarang&unitLokasi=${encodeURIComponent(sesiUser.unitLokasi)}&isAdmin=${sesiUser.isAdmin}`);
      const json = await res.json();
      if (json.status === "success") {
        rawStokData = json.data;
        terapkanFilterStok();
      }
    } catch(e) { document.getElementById('containerTabelStok').innerHTML = "Gagal memuat data."; }
  }

  function terapkanFilterStok() {
    const selectedUnit = document.getElementById('filterUnit').value;
    const selectedGudang = document.getElementById('filterGudang').value;
    const searchVal = document.getElementById('searchStok').value.toLowerCase().trim();

    let filtered = rawStokData.filter(item => {
      if (selectedUnit && item.kodeUnit !== selectedUnit) return false;
      if (selectedGudang && item.kodeGudang !== selectedGudang) return false;
      if (searchVal && !item.namaBarang.toLowerCase().includes(searchVal) && !item.kodeBarang.toLowerCase().includes(searchVal)) return false;
      return true;
    });

    document.getElementById('statTotalJenis').innerText = filtered.length;
    document.getElementById('statStokKritis').innerText = filtered.filter(i => i.sisaStok <= i.stokMin).length;
    renderTabelStok(filtered);
  }

  function renderTabelStok(data) {
    if (data.length === 0) {
      document.getElementById('containerTabelStok').innerHTML = "<p style='text-align:center; padding:20px;'>Barang tidak ditemukan pada gudang ini.</p>";
      return;
    }

    let html = `<table><thead><tr>
      <th>Kode</th><th>Nama Barang</th><th>Kategori</th>
      <th>Lokasi Unit</th><th>Gudang</th><th>Sisa Stok</th><th>Status</th><th>Aksi Mutasi</th>
    </tr></thead><tbody>`;

    data.forEach(item => {
      let gudangObj = masterGudang.find(g => g.kodeGudang === item.kodeGudang);
      let namaGudang = gudangObj ? gudangObj.namaGudang : item.kodeGudang;
      let isMenipis = item.sisaStok <= item.stokMin;

      html += `<tr>
        <td><b>${item.kodeBarang}</b></td>
        <td><b>${item.namaBarang}</b></td>
        <td>${item.kategori}</td>
        <td><i class="fa-solid fa-location-dot" style="color:#0284c7;"></i> ${item.kodeUnit}</td>
        <td><i class="fa-solid fa-warehouse" style="color:#4f46e5;"></i> ${namaGudang}</td>
        <td style="font-size:14px; font-weight:700; color:${isMenipis ? '#dc2626' : '#0284c7'};">${item.sisaStok} ${item.satuan}</td>
        <td>${isMenipis ? `<span class="badge badge-warning">Menipis (Min: ${item.stokMin})</span>` : `<span class="badge badge-ok">Aman</span>`}</td>
        <td>
          <button class="btn-sm" style="background:#10b981;" onclick="bukaModalMutasi('${item.kodeBarang}', '${item.namaBarang}', 'MASUK')">+ Masuk</button>
          <button class="btn-sm" style="background:#f59e0b;" onclick="bukaModalMutasi('${item.kodeBarang}', '${item.namaBarang}', 'KELUAR')">- Keluar</button>
        </td>
      </tr>`;
    });
    html += `</tbody></table>`;
    document.getElementById('containerTabelStok').innerHTML = html;
  }

  function bukaModalGudang() { document.getElementById('modalGudang').style.display = 'block'; }
  function bukaModalTambahBarang() { 
    updateSubGudangPilih('barangUnitPilih', 'barangGudangPilih');
    document.getElementById('modalBarang').style.display = 'block'; 
  }
  function tutupModal(id) { document.getElementById(id).style.display = 'none'; }

  document.getElementById('formTambahGudang').addEventListener('submit', async function(e) {
    e.preventDefault();
    const payload = {
      action: "tambahGudang",
      kodeUnit: document.getElementById('gudangUnitPilih').value,
      namaGudang: document.getElementById('namaGudangBaru').value.trim()
    };
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
    const json = await res.json();
    if (json.status === "success") { alert("Gudang Ditambahkan!"); tutupModal('modalGudang'); muatMetaUnitsGudang(); }
  });

  document.getElementById('formTambahBarang').addEventListener('submit', async function(e) {
    e.preventDefault();
    const payload = {
      action: "tambahBarangStok",
      kodeUnit: document.getElementById('barangUnitPilih').value,
      kodeGudang: document.getElementById('barangGudangPilih').value,
      namaBarang: document.getElementById('tambahNama').value.trim(),
      kategori: document.getElementById('tambahKategori').value,
      satuan: document.getElementById('tambahSatuan').value.trim(),
      stokAwal: document.getElementById('tambahStokAwal').value,
      stokMin: document.getElementById('tambahStokMin').value
    };
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
    const json = await res.json();
    if (json.status === "success") { alert("Barang Berhasil Ditambahkan!"); tutupModal('modalBarang'); muatDataStok(); }
  });

  function bukaModalMutasi(kode, nama, tipe) {
    document.getElementById('mutasiKodeBarang').value = kode;
    document.getElementById('mutasiNamaBarang').value = nama;
    document.getElementById('mutasiTipe').value = tipe;
    document.getElementById('mutasiTitle').innerText = tipe === 'MASUK' ? "Catat Barang Masuk" : "Catat Barang Keluar";
    document.getElementById('modalMutasi').style.display = 'block';
  }

  document.getElementById('formMutasiStok').addEventListener('submit', async function(e) {
    e.preventDefault();
    const payload = {
      action: "updateMutasiStok",
      kodeBarang: document.getElementById('mutasiKodeBarang').value,
      tipeMutasi: document.getElementById('mutasiTipe').value,
      jumlah: document.getElementById('mutasiJumlah').value
    };
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
    const json = await res.json();
    if (json.status === "success") { alert("Stok Diperbarui!"); tutupModal('modalMutasi'); muatDataStok(); }
  });
</script>

</body>
</html>
