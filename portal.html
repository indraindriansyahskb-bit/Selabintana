<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Permintaan Material & Barang</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root { --primary: #2563eb; --primary-hover: #1d4ed8; --bg-body: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; --border-color: #e2e8f0; }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 25px 15px; }
    .wrapper { max-width: 1100px; margin: auto; }
    .card { background: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color); margin-bottom: 22px; }
    .section-title { font-size: 16px; font-weight: 600; color: #1e293b; margin-top: 0; margin-bottom: 18px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13px; color: #334155; }
    input[type="text"], input[type="password"], select, input[type="number"], input[type="date"], textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 13px; font-family: inherit; }
    .row-group { display: flex; gap: 14px; flex-wrap: wrap; }
    .row-group .form-group { flex: 1; min-width: 170px; }
    button { background-color: var(--primary); color: white; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    button:hover { background-color: var(--primary-hover); }
    .user-info-box { background: #e0f2fe; border: 1px solid #7dd3fc; padding: 14px 18px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; color: #0369a1; display: flex; justify-content: space-between; align-items: center; }
    .item-box { background: #f8fafc; border: 1px solid var(--border-color); padding: 16px; border-radius: 8px; margin-bottom: 12px; position: relative; }
    .table-responsive { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-color); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; text-align: left; }
    th, td { padding: 11px 13px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    th { background-color: #f8fafc; font-weight: 600; color: #475569; font-size: 11px; text-transform: uppercase; }
    .badge { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 15px; font-size: 11px; font-weight: 600; }
    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-acc { background: #d1fae5; color: #047857; }
    .badge-reject { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- FORM LOGIN -->
  <div id="loginSection" class="card" style="max-width: 380px; margin: 40px auto;">
    <h3 class="section-title"><i class="fa-solid fa-right-to-bracket"></i> Login Portal Permintaan</h3>
    <div class="form-group"><label>Username</label><input type="text" id="loginUser" required></div>
    <div class="form-group"><label>Password</label><input type="password" id="loginPass" required></div>
    <button type="button" onclick="prosesLogin()" style="width:100%; margin-top: 8px;"><i class="fa-solid fa-sign-in-alt"></i> Masuk</button>
  </div>

  <!-- DASHBOARD PORTAL PERMINTAAN -->
  <div id="mainPanel" style="display: none;">
    <div class="user-info-box" id="infoSesiUser"></div>

    <!-- FORM BUAT PERMINTAAN -->
    <div class="card">
      <h3 class="section-title"><i class="fa-solid fa-pen-to-square"></i> Buat Permintaan Barang Baru</h3>
      <form id="formPermintaan">
        <div class="row-group">
          <div class="form-group">
            <label>Tanggal Permintaan</label>
            <input type="text" id="tglPermintaan" readonly style="background:#e2e8f0;">
          </div>
          <div class="form-group">
            <label>Tanggal Dibutuhkan</label>
            <input type="date" id="tglDibutuhkan" required>
          </div>
          <div class="form-group">
            <label>Urgensi</label>
            <select id="urgensi">
              <option value="REGULER">REGULER</option>
              <option value="URGENT">URGENT</option>
              <option value="TOP URGENT">TOP URGENT</option>
            </select>
          </div>
        </div>

        <div class="section-title" style="font-size:14px; margin-top:15px;"><i class="fa-solid fa-list-check"></i> Daftar Rincian Barang:</div>
        <div id="containerItems"></div>
        <button type="button" onclick="tambahItemForm()" style="background:#059669; margin-bottom:15px;"><i class="fa-solid fa-plus"></i> Tambah Item Barang</button>

        <div class="form-group">
          <label>Keperluan / Keterangan</label>
          <textarea id="keterangan" rows="3" placeholder="Jelaskan keperluan permintaan barang..."></textarea>
        </div>

        <button type="submit" id="btnSubmit" style="width:100%; padding:12px; font-size:14px;"><i class="fa-solid fa-paper-plane"></i> Kirim Permintaan ke Admin</button>
      </form>
    </div>

    <!-- RIWAYAT & STATUS -->
    <div class="card">
      <h3 class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat & Status Pengajuan Anda</h3>
      <div class="table-responsive" id="containerRiwayat">
        <p style="text-align:center; padding:20px;">Memuat data riwayat pengajuan...</p>
      </div>
    </div>
  </div>
</div>

<script>
  // GANTI DENGAN URL WEB APP HASIL DEPLOY TERBARU ANDA
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzLzwltzMnAawduEJQZouDlwnh64nPFVAlGCP5Y3S_nOivyh3vUsIdiSgTO9CEZrjjPBg/exec";

  let sesiUser = {};
  let itemCounter = 0;

  window.onload = function() {
    const saved = localStorage.getItem('portal_user_session');
    if (saved) {
      sesiUser = JSON.parse(saved);
      tampilkanDashboard();
    }
  };

  async function prosesLogin() {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value.trim();
    if (!u || !p) return alert("Masukkan Username & Password!");

    try {
      const res = await fetch(`${GAS_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`);
      const result = await res.json();
      if (result.status === "success") {
        sesiUser = result.userData;
        localStorage.setItem('portal_user_session', JSON.stringify(sesiUser));
        tampilkanDashboard();
      } else {
        alert("Login Gagal: " + result.message);
      }
    } catch (e) {
      alert("Kesalahan koneksi ke server Apps Script.");
    }
  }

  function tampilkanDashboard() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('mainPanel').style.display = 'block';
    
    document.getElementById('infoSesiUser').innerHTML = `
      <div><b>Pemohon: ${sesiUser.nama}</b> (${sesiUser.divisi} | Unit: <b>${sesiUser.unitLokasi}</b>)</div>
      <button onclick="logoutSesi()" style="background:#fee2e2; color:#dc2626; border:1px solid #fca5a5; padding:5px 10px; font-size:12px;">Keluar</button>
    `;

    let today = new Date().toISOString().split('T')[0];
    document.getElementById('tglPermintaan').value = today;

    document.getElementById('containerItems').innerHTML = "";
    itemCounter = 0;
    tambahItemForm();
    muatRiwayatPermintaan();
  }

  function logoutSesi() {
    localStorage.removeItem('portal_user_session');
    location.reload();
  }

  function tambahItemForm() {
    itemCounter++;
    const div = document.createElement('div');
    div.className = 'item-box';
    div.id = `itemRow_${itemCounter}`;
    div.innerHTML = `
      <div style="font-weight:600; font-size:13px; color:#0284c7; margin-bottom:10px;">Barang #${itemCounter}</div>
      <div class="row-group">
        <div class="form-group"><label>Kode Barang (Supplier)</label><input type="text" class="it-kode" placeholder="Kode supplier..."></div>
        <div class="form-group"><label>Kategori</label>
          <select class="it-kategori">
            <option value="PAKAN">PAKAN</option><option value="OBAT">OBAT</option><option value="VAKSIN">VAKSIN</option>
            <option value="VITAMIN">VITAMIN</option><option value="KIMIA">KIMIA</option><option value="PERALATAN">PERALATAN</option><option value="LAINNYA" selected>LAINNYA</option>
          </select>
        </div>
        <div class="form-group"><label>Nama Barang</label><input type="text" class="it-nama" placeholder="Nama barang..." required></div>
      </div>
      <div class="row-group">
        <div class="form-group"><label>Jumlah</label><input type="number" class="it-jumlah" min="1" required></div>
        <div class="form-group"><label>Satuan</label><input type="text" class="it-satuan" placeholder="pcs/kg/zak" required></div>
        <div class="form-group"><label>Supplier</label><input type="text" class="it-supplier" placeholder="Supplier"></div>
      </div>
      ${itemCounter > 1 ? `<button type="button" onclick="hapusItemForm('itemRow_${itemCounter}')" style="background:#ef4444; padding:4px 8px; font-size:11px; margin-top:5px;">Hapus Item</button>` : ''}
    `;
    document.getElementById('containerItems').appendChild(div);
  }

  function hapusItemForm(id) {
    const elem = document.getElementById(id);
    if (elem) elem.remove();
  }

  document.getElementById('formPermintaan').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerHTML = "Mengirim...";

    let itemsArr = [];
    const itemBoxes = document.querySelectorAll('.item-box');
    itemBoxes.forEach(box => {
      itemsArr.push({
        kodeSupplier: box.querySelector('.it-kode').value.trim(),
        kategori: box.querySelector('.it-kategori').value,
        namaBarang: box.querySelector('.it-nama').value.trim(),
        jumlah: box.querySelector('.it-jumlah').value,
        satuan: box.querySelector('.it-satuan').value.trim(),
        supplier: box.querySelector('.it-supplier').value.trim()
      });
    });

    const payload = {
      action: "submitPermintaan",
      pemohon: sesiUser.nama || sesiUser.username,
      divisi: sesiUser.divisi,
      unitLokasi: sesiUser.unitLokasi,
      tglPermintaan: document.getElementById('tglPermintaan').value,
      tglDibutuhkan: document.getElementById('tglDibutuhkan').value,
      urgensi: document.getElementById('urgensi').value,
      keterangan: document.getElementById('keterangan').value.trim(),
      items: itemsArr
    };

    try {
      const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
      const json = await res.json();
      if (json.status === "success") {
        alert(json.message);
        document.getElementById('formPermintaan').reset();
        tampilkanDashboard();
      } else {
        alert("Gagal: " + json.message);
      }
    } catch(err) {
      alert("Kesalahan koneksi pengiriman.");
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Permintaan ke Admin';
    }
  });

  async function muatRiwayatPermintaan() {
    try {
      const res = await fetch(`${GAS_URL}?action=getPermintaan&username=${encodeURIComponent(sesiUser.nama || sesiUser.username)}&unitLokasi=${encodeURIComponent(sesiUser.unitLokasi)}&isAdmin=${sesiUser.isAdmin}`);
      const json = await res.json();

      if (json.status === "success") {
        if (json.data.length === 0) {
          document.getElementById('containerRiwayat').innerHTML = "<p style='text-align:center; padding:20px;'>Belum ada riwayat pengajuan permintaan.</p>";
          return;
        }

        let html = `<table><thead><tr>
          <th>Kode Tiket</th><th>Tgl Pembuatan</th><th>Pemohon</th><th>Unit Farm</th><th>Nama Barang</th><th>Jumlah</th><th>Urgensi</th><th>Status</th>
        </tr></thead><tbody>`;

        json.data.forEach(item => {
          let badge = `<span class="badge badge-pending">PENDING</span>`;
          let st = (item.statusPermintaan || "").toUpperCase();
          if (st === "ACC" || st === "APPROVED") badge = `<span class="badge badge-acc">ACC</span>`;
          else if (st === "DITOLAK" || st === "REJECTED") badge = `<span class="badge badge-reject">DITOLAK</span>`;

          html += `<tr>
            <td><b>${item.kodeTiket}</b></td>
            <td><small>${item.tglPermintaan}</small></td>
            <td>${item.pemohon}</td>
            <td>${item.unitLokasi}</td>
            <td><b>${item.namaBarang}</b></td>
            <td>${item.jumlah} ${item.satuan}</td>
            <td><small>${item.urgensi}</small></td>
            <td>${badge}</td>
          </tr>`;
        });

        html += `</tbody></table>`;
        document.getElementById('containerRiwayat').innerHTML = html;
      }
    } catch(e) {
      document.getElementById('containerRiwayat').innerHTML = "<p style='text-align:center; color:#ef4444; padding:20px;'>Gagal memuat riwayat.</p>";
    }
  }
</script>

</body>
</html>
