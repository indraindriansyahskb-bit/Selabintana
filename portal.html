<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Permintaan Material & Barang</title>
  <style>
    :root {
      --primary-color: #1a73e8;
      --primary-hover: #1557b0;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #dadce0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .wrapper {
      max-width: 1000px;
      margin: auto;
    }
    .card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      margin-bottom: 25px;
    }
    h2, h3 {
      color: #1f2937;
      margin-top: 0;
    }
    h2 {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid #f3f4f6;
      padding-bottom: 15px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
      color: #4b5563;
    }
    input[type="text"], input[type="password"], select, textarea, input[type="date"], input[type="number"], input[type="month"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 13px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
    }
    textarea {
      resize: vertical;
      height: 80px;
    }
    .row-group {
      display: flex;
      gap: 15px;
    }
    .row-group .form-group {
      flex: 1;
    }
    .file-upload-box {
      border: 2px dashed var(--border-color);
      padding: 20px;
      text-align: center;
      border-radius: 6px;
      background: #fafafa;
      cursor: pointer;
    }
    .file-upload-box:hover {
      border-color: var(--primary-color);
      background: #f1f5f9;
    }
    #fileInfo {
      margin-top: 8px;
      font-size: 13px;
      color: #059669;
      font-weight: 500;
    }
    button {
      background-color: var(--primary-color);
      color: white;
      padding: 12px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      width: 100%;
    }
    button:hover { background-color: var(--primary-hover); }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }
    
    .user-info-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 12px 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #1e40af;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logout-link { color: #dc2626; text-decoration: none; font-weight: 600; font-size: 13px; }

    /* Summary Cards Admin */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-card .val { font-size: 22px; font-weight: bold; margin-top: 5px; color: #1e293b; }
    .stat-card.total { border-left: 4px solid #1a73e8; }
    .stat-card.acc { border-left: 4px solid #16a34a; }
    .stat-card.pending { border-left: 4px solid #d97706; }
    .stat-card.tolak { border-left: 4px solid #dc2626; }

    /* Filter Bar */
    .filter-card {
      background: #f1f5f9;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
    }
    .filter-item { flex: 1; min-width: 150px; }

    /* Tabel Style */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; }
    th, td { border: 1px solid #e5e7eb; padding: 10px; text-align: left; }
    th { background-color: #f9fafb; font-weight: 600; color: #374151; }
    tr:nth-child(even) { background-color: #f9fafb; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-acc { background: #dcfce7; color: #166534; }
    .badge-revisi { background: #e0f2fe; color: #075985; }
    .badge-tolak { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="card">
    <h2>Portal Permintaan Material & Barang</h2>
    
    <!-- Login Section -->
    <div id="loginSection">
      <div class="form-group">
        <label for="loginUser">Username:</label>
        <input type="text" id="loginUser" placeholder="Masukkan username..." required>
      </div>
      <div class="form-group">
        <label for="loginPass">Password:</label>
        <input type="password" id="loginPass" placeholder="Masukkan password..." required>
      </div>
      <button type="button" onclick="prosesLogin()">Login ke Portal</button>
      <div id="loginLoading" style="display:none; text-align:center; margin-top:10px; font-size:13px; color:#1a73e8;">Memeriksa kredensial...</div>
    </div>

    <!-- Form Pengajuan Khusus Staff -->
    <form id="formPermintaan" style="display: none;">
      <div class="user-info-box" id="infoSesiStaff"></div>

      <div class="row-group">
        <div class="form-group">
          <label for="tglPermintaan">Tanggal Permintaan</label>
          <input type="date" id="tglPermintaan" required>
        </div>
        <div class="form-group">
          <label for="tglDibutuhkan">Tanggal Dibutuhkan</label>
          <input type="date" id="tglDibutuhkan" required>
        </div>
      </div>

      <div class="row-group">
        <div class="form-group">
          <label for="urgensi">Urgensi</label>
          <select id="urgensi" required>
            <option value="REGULER">REGULER</option>
            <option value="URGENT">URGENT</option>
            <option value="TOP URGENT">TOP URGENT</option>
          </select>
        </div>
        <div class="form-group">
          <label for="kategori">Kategori Barang</label>
          <select id="kategori" required onchange="filterMasterBarangByKategori(this.value)">
            <option value="">-- Pilih Kategori --</option>
            <option value="OBAT">OBAT</option>
            <option value="VAKSIN">VAKSIN</option>
            <option value="VITAMIN">VITAMIN</option>
            <option value="KIMIA">KIMIA</option>
            <option value="PERALATAN">PERALATAN</option>
            <option value="PAKAN">PAKAN</option>
            <option value="LAINNYA">LAINNYA</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="namaBarang">Nama Barang / Material</label>
        <input type="text" id="namaBarang" list="listMasterBarang" required placeholder="Pilih atau ketik nama barang...">
        <datalist id="listMasterBarang"></datalist>
      </div>

      <div class="row-group">
        <div class="form-group">
          <label for="jumlah">Jumlah</label>
          <input type="number" id="jumlah" min="1" required placeholder="Contoh: 10">
        </div>
        <div class="form-group">
          <label for="satuan">Satuan</label>
          <input type="text" id="satuan" required placeholder="Contoh: liter / vial / kg / pcs">
        </div>
      </div>

      <div class="form-group">
        <label for="supplier">Supplier / Vendor Rujukan</label>
        <input type="text" id="supplier" placeholder="Nama supplier...">
      </div>

      <div class="form-group">
        <label for="keterangan">Keperluan / Keterangan</label>
        <textarea id="keterangan" placeholder="Tuliskan keterangan keperluan material..."></textarea>
      </div>

      <div class="form-group">
        <label for="lampiranFile">Unggah Dokumen PDF Tanda Tangan (Setelah Dicetak & TTD)</label>
        <div class="file-upload-box" onclick="document.getElementById('lampiranFile').click()">
          📂 Klik untuk memilih file PDF bertanda tangan
          <input type="file" id="lampiranFile" accept="application/pdf" style="display: none;" onchange="handleFileSelect(event)">
          <div id="fileInfo">Belum ada file dipilih</div>
        </div>
      </div>

      <button type="submit" id="submitBtn">Kirim Permintaan ke Admin</button>
      <div id="loadingStatus" style="text-align:center; margin-top:10px; font-style:italic; color:#1a73e8; display:none;">Sedang memproses...</div>
    </form>

    <!-- Panel Khusus Admin (Verifikasi & Rekapitulasi) -->
    <div id="panelAdmin" style="display: none;">
      <div class="user-info-box" id="infoSesiAdmin"></div>

      <!-- Ringkasan Statistik -->
      <div class="summary-grid">
        <div class="stat-card total"><label>Total</label><div class="val" id="statTotal">0</div></div>
        <div class="stat-card pending"><label>Pending</label><div class="val" id="statPending">0</div></div>
        <div class="stat-card acc"><label>Di ACC</label><div class="val" id="statACC">0</div></div>
        <div class="stat-card tolak"><label>Revisi/Tolak</label><div class="val" id="statTolak">0</div></div>
      </div>

      <!-- Filter Rekapitulasi -->
      <div class="filter-card">
        <div class="filter-item">
          <label for="filterBulan">Periode Bulan:</label>
          <input type="month" id="filterBulan" onchange="terapkanFilterAdmin()">
        </div>
        <div class="filter-item">
          <label for="filterUnit">Unit / Lokasi:</label>
          <select id="filterUnit" onchange="terapkanFilterAdmin()">
            <option value="">-- Semua Unit --</option>
          </select>
        </div>
        <div class="filter-item">
          <label for="filterKategori">Kategori:</label>
          <select id="filterKategori" onchange="terapkanFilterAdmin()">
            <option value="">-- Semua Kategori --</option>
            <option value="OBAT">OBAT</option>
            <option value="VAKSIN">VAKSIN</option>
            <option value="VITAMIN">VITAMIN</option>
            <option value="KIMIA">KIMIA</option>
            <option value="PERALATAN">PERALATAN</option>
            <option value="PAKAN">PAKAN</option>
            <option value="LAINNYA">LAINNYA</option>
          </select>
        </div>
        <div class="filter-item">
          <label for="filterStatus">Status:</label>
          <select id="filterStatus" onchange="terapkanFilterAdmin()">
            <option value="">-- Semua Status --</option>
            <option value="PENDING">PENDING</option>
            <option value="ACC">ACC</option>
            <option value="REVISI">REVISI</option>
            <option value="DITOLAK">DITOLAK</option>
          </select>
        </div>
        <div class="filter-item" style="flex: 0 0 auto;">
          <button onclick="eksporKeCSV()" style="background:#059669; padding: 10px;">📥 Unduh CSV</button>
        </div>
      </div>

      <h3>Daftar & Rekapitulasi Permintaan</h3>
      <div class="table-responsive" id="containerTabelAdmin">
        <p>Memuat data permintaan...</p>
      </div>
    </div>

  </div>
</div>

<script>
  // URL Web App Google Apps Script kamu
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyXv7p4QS7P_6EmgNDT2hr9y3iQ4jaZo3L31o-NPB5A3lT6ZmicDfZnbVi0CF8p8OT8PQ/exec";

  let sesiUser = {};
  let masterBarangData = [];
  let rawAdminData = [];

  window.onload = function() {
    const savedUser = localStorage.getItem('portal_user_session');
    if (savedUser) {
      sesiUser = JSON.parse(savedUser);
      tampilkanDashboard();
    }
    const tgl = document.getElementById('tglPermintaan');
    if(tgl) tgl.value = new Date().toISOString().split('T')[0];
  };

  async function prosesLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    const loading = document.getElementById('loginLoading');

    if (!username || !password) {
      alert("Masukkan Username dan Password!");
      return;
    }

    loading.style.display = "block";
    try {
      const response = await fetch(`${GAS_URL}?action=login&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
      const result = await response.json();

      if (result.status === "success") {
        sesiUser = result.userData;
        localStorage.setItem('portal_user_session', JSON.stringify(sesiUser));
        tampilkanDashboard();
      } else {
        alert("Login Gagal: " + result.message);
      }
    } catch (err) {
      console.error(err);
      alert("Terjadi kesalahan koneksi ke server.");
    } finally {
      loading.style.display = "none";
    }
  }

  function tampilkanDashboard() {
    document.getElementById('loginSection').style.display = 'none';

    if (sesiUser.isAdmin) {
      document.getElementById('panelAdmin').style.display = 'block';
      document.getElementById('infoSesiAdmin').innerHTML = `
        <div>
          🛠️ <b>ADMIN: ${sesiUser.nama}</b><br>
          <small>Pusat Kontrol & Verifikasi Permintaan</small>
        </div>
        <a href="#" onclick="logoutSesi()" class="logout-link">Keluar</a>
      `;
      muatDataAdmin();
    } else {
      document.getElementById('formPermintaan').style.display = 'block';
      document.getElementById('infoSesiStaff').innerHTML = `
        <div>
          👤 <b>Pemohon: ${sesiUser.nama}</b> (${sesiUser.jabatan})<br>
          <small>🏢 ${sesiUser.divisi} | 📍 ${sesiUser.unitLokasi}</small>
        </div>
        <a href="#" onclick="logoutSesi()" class="logout-link">Keluar</a>
      `;
      muatMasterBarang();
    }
  }

  function logoutSesi() {
    localStorage.clear();
    location.reload();
  }

  async function muatMasterBarang() {
    try {
      const response = await fetch(GAS_URL + "?action=getMasterBarang");
      const result = await response.json();
      if (result.status === "success") {
        masterBarangData = result.data;
        perbaruiDatalist(masterBarangData);
      }
    } catch (e) {
      console.error("Gagal memuat master barang:", e);
    }
  }

  function perbaruiDatalist(dataList) {
    const datalist = document.getElementById('listMasterBarang');
    datalist.innerHTML = "";
    dataList.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.namaBarang;
      datalist.appendChild(opt);
    });
  }

  function filterMasterBarangByKategori(kategoriVal) {
    if (!kategoriVal) {
      perbaruiDatalist(masterBarangData);
      return;
    }
    const filtered = masterBarangData.filter(i => i.kategori && i.kategori.toUpperCase() === kategoriVal.toUpperCase());
    perbaruiDatalist(filtered);
  }

  function handleFileSelect(event) {
    const file = event.target.files[0];
    const fileInfo = document.getElementById('fileInfo');
    if (file) {
      if (file.type !== "application/pdf") {
        alert("Harap unggah file berformat PDF!");
        event.target.value = "";
        fileInfo.innerText = "Belum ada file dipilih";
        return;
      }
      fileInfo.innerText = `📄 ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;
    } else {
      fileInfo.innerText = "Belum ada file dipilih";
    }
  }

  function convertFileToBase64(file) {
    return new Promise((resolve) => {
      if (!file) { resolve(""); return; }
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
    });
  }

  document.getElementById('formPermintaan').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const loading = document.getElementById('loadingStatus');
    btn.disabled = true;
    btn.innerText = "Memproses...";
    loading.style.display = "block";

    try {
      const fileInput = document.getElementById('lampiranFile');
      let base64File = "";
      let fileName = "";
      let mimeType = "application/pdf";

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        fileName = file.name;
        mimeType = file.type;
        base64File = await convertFileToBase64(file);
      }

      const payload = {
        action: "submitPermintaan",
        namaPemohon: sesiUser.nama,
        divisi: sesiUser.divisi,
        unitLokasi: sesiUser.unitLokasi,
        tglPermintaan: document.getElementById('tglPermintaan').value,
        tglDibutuhkan: document.getElementById('tglDibutuhkan').value,
        urgensi: document.getElementById('urgensi').value,
        kategori: document.getElementById('kategori').value,
        namaBarang: document.getElementById('namaBarang').value.trim(),
        jumlah: document.getElementById('jumlah').value,
        satuan: document.getElementById('satuan').value,
        supplier: document.getElementById('supplier').value.trim(),
        keterangan: document.getElementById('keterangan').value.trim(),
        fileName: fileName,
        mimeType: mimeType,
        fileData: base64File
      };

      const response = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if (result.status === "success") {
        alert("Permintaan berhasil dikirim! Silakan cetak dokumen untuk proses tanda tangan.");
        document.getElementById('formPermintaan').reset();
        document.getElementById('tglPermintaan').value = new Date().toISOString().split('T')[0];
        document.getElementById('fileInfo').innerText = "Belum ada file dipilih";
        muatMasterBarang();
      } else {
        alert("Gagal: " + result.message);
      }
    } catch (err) {
      console.error(err);
      alert("Terjadi kesalahan jaringan.");
    } finally {
      btn.disabled = false;
      btn.innerText = "Kirim Permintaan ke Admin";
      loading.style.display = "none";
    }
  });

  async function muatDataAdmin() {
    try {
      const res = await fetch(GAS_URL + "?action=getPermintaanAdmin");
      const json = await res.json();
      if (json.status === "success") {
        rawAdminData = json.data;
        populateUnitFilter(rawAdminData);
        terapkanFilterAdmin();
      }
    } catch(e) {
      document.getElementById('containerTabelAdmin').innerHTML = "Gagal memuat data.";
    }
  }

  function populateUnitFilter(data) {
    const selectUnit = document.getElementById('filterUnit');
    selectUnit.innerHTML = '<option value="">-- Semua Unit --</option>';
    const units = [...new Set(data.map(item => item.unit).filter(Boolean))];
    units.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u;
      opt.innerText = u;
      selectUnit.appendChild(opt);
    });
  }

  function terapkanFilterAdmin() {
    const filterBulan = document.getElementById('filterBulan').value;
    const filterUnit = document.getElementById('filterUnit').value;
    const filterKategori = document.getElementById('filterKategori').value;
    const filterStatus = document.getElementById('filterStatus').value;

    let filtered = rawAdminData.filter(item => {
      if (filterBulan) {
        const itemDate = item.tglPermintaan || "";
        if (!itemDate.startsWith(filterBulan)) return false;
      }
      if (filterUnit && item.unit !== filterUnit) return false;
      if (filterKategori && item.kategori && item.kategori.toUpperCase() !== filterKategori.toUpperCase()) return false;
      if (filterStatus && item.status !== filterStatus) return false;
      return true;
    });

    renderStatistik(filtered);
    renderTabelAdmin(filtered);
  }

  function renderStatistik(data) {
    document.getElementById('statTotal').innerText = data.length;
    document.getElementById('statPending').innerText = data.filter(i => i.status === 'PENDING').length;
    document.getElementById('statACC').innerText = data.filter(i => i.status === 'ACC').length;
    document.getElementById('statTolak').innerText = data.filter(i => i.status === 'REVISI' || i.status === 'DITOLAK').length;
  }

  function formatGoogleDriveUrl(url) {
    if (!url || url === '-') return '-';
    if (url.includes('/file/d/')) {
      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/uc?export=view&id=${match[1]}`;
      }
    }
    return url;
  }

  function renderTabelAdmin(data) {
    if (data.length === 0) {
      document.getElementById('containerTabelAdmin').innerHTML = "<p style='text-align:center; padding:20px; color:#666;'>Tidak ada data permintaan.</p>";
      return;
    }

    let html = `<table><thead><tr>
      <th>Kode</th><th>Tanggal</th><th>Pemohon / Unit</th><th>Kategori & Barang</th><th>Jumlah</th><th>Status</th><th>Dokumen PDF</th><th>Aksi Admin</th>
    </tr></thead><tbody>`;

    data.forEach(row => {
      let badgeClass = 'badge-pending';
      if(row.status === 'ACC') badgeClass = 'badge-acc';
      else if(row.status === 'REVISI') badgeClass = 'badge-revisi';
      else if(row.status === 'DITOLAK') badgeClass = 'badge-tolak';

      const cleanPdfUrl = formatGoogleDriveUrl(row.pdfUrl);

      html += `<tr>
        <td><b>${row.kode}</b></td>
        <td>${row.tglPermintaan || '-'}</td>
        <td><b>${row.pemohon}</b><br><small>${row.unit}</small></td>
        <td><span class="badge" style="background:#e2e8f0; color:#334155;">${row.kategori || '-'}</span><br>${row.barang}</td>
        <td>${row.jumlah} ${row.satuan}</td>
        <td>
          <span class="badge ${badgeClass}">${row.status}</span>
          ${row.catatan && row.catatan !== '-' ? `<br><small style="color:#666;">Catatan: ${row.catatan}</small>` : ''}
        </td>
        <td>${cleanPdfUrl !== '-' ? `<a href="${cleanPdfUrl}" target="_blank" style="color:#1a73e8; font-weight:bold;">Buka PDF</a>` : '<span style="color:#999;">Belum ada</span>'}</td>
        <td>
          <select id="status_${row.kode}" style="padding:4px; font-size:12px; margin-bottom:4px;">
            <option value="PENDING" ${row.status==='PENDING'?'selected':''}>PENDING</option>
            <option value="ACC" ${row.status==='ACC'?'selected':''}>ACC</option>
            <option value="REVISI" ${row.status==='REVISI'?'selected':''}>REVISI</option>
            <option value="DITOLAK" ${row.status==='DITOLAK'?'selected':''}>DITOLAK</option>
          </select><br>
          <input type="text" id="catatan_${row.kode}" value="${row.catatan !== '-' ? row.catatan : ''}" placeholder="Catatan..." style="font-size:12px; padding:4px;"><br>
          <button onclick="updateStatusAdmin('${row.kode}')" style="padding:4px 8px; font-size:12px; margin-top:4px; background:#1a73e8; width:auto;">Simpan</button>
        </td>
      </tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById('containerTabelAdmin').innerHTML = html;
  }

  async function updateStatusAdmin(kodeBarang) {
    const status = document.getElementById(`status_${kodeBarang}`).value;
    const catatan = document.getElementById(`catatan_${kodeBarang}`).value;

    try {
      const payload = { action: "updateStatus", kodeBarang: kodeBarang, status: status, catatan: catatan };
      const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
      const json = await res.json();
      if(json.status === "success") {
        alert("Status berhasil diperbarui!");
        muatDataAdmin();
      } else {
        alert("Gagal: " + json.message);
      }
    } catch(e) {
      alert("Terjadi kesalahan jaringan.");
    }
  }

  function eksporKeCSV() {
    const filterBulan = document.getElementById('filterBulan').value;
    const filterUnit = document.getElementById('filterUnit').value;
    const filterKategori = document.getElementById('filterKategori').value;
    const filterStatus = document.getElementById('filterStatus').value;

    let filtered = rawAdminData.filter(item => {
      if (filterBulan && !(item.tglPermintaan || "").startsWith(filterBulan)) return false;
      if (filterUnit && item.unit !== filterUnit) return false;
      if (filterKategori && item.kategori && item.kategori.toUpperCase() !== filterKategori.toUpperCase()) return false;
      if (filterStatus && item.status !== filterStatus) return false;
      return true;
    });

    if(filtered.length === 0) { alert("Tidak ada data untuk diekspor!"); return; }

    let csvContent = "data:text/csv;charset=utf-8,";
    csvContent += "Kode_Barang,Tanggal_Permintaan,Pemohon,Unit_Lokasi,Kategori,Nama_Barang,Jumlah,Satuan,Status,Catatan_Admin,Link_PDF\n";

    filtered.forEach(row => {
      let line = `"${row.kode}","${row.tglPermintaan}","${row.pemohon}","${row.unit}","${row.kategori}","${row.barang}","${row.jumlah}","${row.satuan}","${row.status}","${row.catatan}","${row.pdfUrl}"`;
      csvContent += line + "\n";
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `Rekap_Permintaan_${filterBulan || 'Semua'}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
