<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Permintaan Barang & Peralatan</title>
  <style>
    :root {
      --primary-color: #1a73e8;
      --primary-hover: #1557b0;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #dadce0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 30px 15px;
    }
    .wrapper {
      max-width: 700px;
      margin: auto;
    }
    .card {
      background: var(--card-bg);
      padding: 35px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      margin-bottom: 25px;
    }
    h2 {
      color: #1f2937;
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 24px;
      font-weight: 600;
      border-bottom: 2px solid #f3f4f6;
      padding-bottom: 15px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: #4b5563;
    }
    input[type="text"], input[type="password"], select, textarea, input[type="date"], input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
    }
    textarea {
      resize: vertical;
      height: 90px;
    }
    .row-group {
      display: flex;
      gap: 20px;
    }
    .row-group .form-group {
      flex: 1;
    }
    .file-upload-box {
      border: 2px dashed var(--border-color);
      padding: 20px;
      text-align: center;
      border-radius: 6px;
      background: #fafafa;
      cursor: pointer;
    }
    .file-upload-box:hover {
      border-color: var(--primary-color);
      background: #f1f5f9;
    }
    #fileInfo {
      margin-top: 8px;
      font-size: 13px;
      color: #059669;
      font-weight: 500;
    }
    button {
      background-color: var(--primary-color);
      color: white;
      padding: 14px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: var(--primary-hover);
    }
    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
    #loadingStatus, #loginLoading {
      text-align: center;
      margin-top: 15px;
      font-style: italic;
      color: var(--primary-color);
      display: none;
      font-size: 14px;
    }
    .user-info-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 25px;
      font-size: 14px;
      color: #1e40af;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logout-link {
      font-size: 13px;
      color: #dc2626;
      text-decoration: none;
      font-weight: 600;
    }
    .logout-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="card">
    <h2>Portal Permintaan Material & Barang</h2>
    
    <!-- Sesi Login Mengacu ke Tab 'Users' -->
    <div id="loginSection">
      <div class="form-group">
        <label for="loginUser">Username:</label>
        <input type="text" id="loginUser" placeholder="Masukkan username Anda..." required>
      </div>
      <div class="form-group">
        <label for="loginPass">Password:</label>
        <input type="password" id="loginPass" placeholder="Masukkan password..." required>
      </div>
      <button type="button" onclick="prosesLogin()">Login ke Portal</button>
      <div id="loginLoading">Memeriksa kredensial...</div>
    </div>

    <!-- Form Utama Permintaan -->
    <form id="formPermintaan" style="display: none;">
      <div class="user-info-box" id="infoSesi"></div>

      <div class="row-group">
        <div class="form-group">
          <label for="tglPermintaan">Tanggal Permintaan</label>
          <input type="date" id="tglPermintaan" required>
        </div>
        <div class="form-group">
          <label for="tglDibutuhkan">Tanggal Dibutuhkan</label>
          <input type="date" id="tglDibutuhkan" required>
        </div>
      </div>

      <div class="row-group">
        <div class="form-group">
          <label for="urgensi">Urgensi</label>
          <select id="urgensi" required>
            <option value="REGULER">REGULER</option>
            <option value="URGENT">URGENT</option>
            <option value="TOP URGENT">TOP URGENT</option>
          </select>
        </div>
        <div class="form-group">
          <label for="kategori">Kategori Barang</label>
          <select id="kategori" required onchange="filterMasterBarangByKategori(this.value)">
            <option value="">-- Pilih Kategori --</option>
            <option value="OBAT">OBAT</option>
            <option value="VAKSIN">VAKSIN</option>
            <option value="VITAMIN">VITAMIN</option>
            <option value="KIMIA">KIMIA</option>
            <option value="PERALATAN">PERALATAN</option>
            <option value="PAKAN">PAKAN</option>
            <option value="LAINNYA">LAINNYA</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="namaBarang">Nama Barang / Material</label>
        <input type="text" id="namaBarang" list="listMasterBarang" required placeholder="Pilih atau ketik nama barang baru..." oninput="cekBarangBaru(this.value)">
        <datalist id="listMasterBarang"></datalist>
        <small id="infoBarangBaru" style="color: #d97706; display: none; margin-top: 4px;">ℹ️ Barang baru akan otomatis ditambahkan ke Master Barang.</small>
      </div>

      <div class="row-group">
        <div class="form-group">
          <label for="jumlah">Jumlah</label>
          <input type="number" id="jumlah" min="1" required placeholder="Contoh: 10">
        </div>
        <div class="form-group">
          <label for="satuan">Satuan</label>
          <input type="text" id="satuan" required placeholder="Contoh: liter / vial / kg / pcs">
        </div>
      </div>

      <div class="form-group">
        <label for="supplier">Supplier / Vendor Rujukan</label>
        <input type="text" id="supplier" placeholder="Nama supplier (opsional)...">
      </div>

      <div class="form-group">
        <label for="keterangan">Keperluan / Keterangan</label>
        <textarea id="keterangan" placeholder="Tuliskan keterangan keperluan material..."></textarea>
      </div>

      <div class="form-group">
        <label for="lampiranFile">Dokumen PDF / TTD (Opsional)</label>
        <div class="file-upload-box" onclick="document.getElementById('lampiranFile').click()">
          📂 Klik untuk memilih file PDF
          <input type="file" id="lampiranFile" accept="application/pdf" style="display: none;" onchange="handleFileSelect(event)">
          <div id="fileInfo">Belum ada file dipilih</div>
        </div>
      </div>

      <button type="submit" id="submitBtn">Kirim Permintaan</button>
      <div id="loadingStatus">Sedang mengirim data ke server...</div>
    </form>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyXv7p4QS7P_6EmgNDT2hr9y3iQ4jaZo3L31o-NPB5A3lT6ZmicDfZnbVi0CF8p8OT8PQ/exec";

  let sesiUser = {};
  let masterBarangData = [];

  window.onload = function() {
    const savedUser = localStorage.getItem('portal_user_session');
    if (savedUser) {
      sesiUser = JSON.parse(savedUser);
      tampilkanFormUtama();
    }
    document.getElementById('tglPermintaan').value = new Date().toISOString().split('T')[0];
  };

  async function prosesLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    const loading = document.getElementById('loginLoading');

    if (!username || !password) {
      alert("Masukkan Username dan Password!");
      return;
    }

    loading.style.display = "block";
    try {
      const response = await fetch(`${GAS_URL}?action=login&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
      const result = await response.json();

      if (result.status === "success") {
        sesiUser = result.userData;
        localStorage.setItem('portal_user_session', JSON.stringify(sesiUser));
        tampilkanFormUtama();
      } else {
        alert("Login Gagal: " + result.message);
      }
    } catch (err) {
      console.error(err);
      alert("Terjadi kesalahan koneksi ke server.");
    } finally {
      loading.style.display = "none";
    }
  }

  function tampilkanFormUtama() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('formPermintaan').style.display = 'block';
    document.getElementById('infoSesi').innerHTML = `
      <div>
        👤 <b>${sesiUser.nama}</b> (${sesiUser.jabatan})<br>
        <small>🏢 ${sesiUser.divisi} | 📍 ${sesiUser.unitLokasi}</small>
      </div>
      <a href="#" onclick="logoutSesi()" class="logout-link">Keluar</a>
    `;
    muatMasterBarang();
  }

  function logoutSesi() {
    localStorage.clear();
    location.reload();
  }

  async function muatMasterBarang() {
    try {
      const response = await fetch(GAS_URL + "?action=getMasterBarang");
      const result = await response.json();
      if (result.status === "success") {
        masterBarangData = result.data; 
        perbaruiDatalist(masterBarangData);
      }
    } catch (e) {
      console.error("Gagal memuat master barang:", e);
    }
  }

  function perbaruiDatalist(dataList) {
    const datalist = document.getElementById('listMasterBarang');
    datalist.innerHTML = "";
    dataList.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.namaBarang;
      datalist.appendChild(opt);
    });
  }

  function filterMasterBarangByKategori(kategoriVal) {
    if (!kategoriVal) {
      perbaruiDatalist(masterBarangData);
      return;
    }
    const filtered = masterBarangData.filter(i => i.kategori && i.kategori.toUpperCase() === kategoriVal.toUpperCase());
    perbaruiDatalist(filtered);
  }

  function cekBarangBaru(val) {
    const info = document.getElementById('infoBarangBaru');
    const match = masterBarangData.some(i => i.namaBarang.toLowerCase() === val.toLowerCase());
    if (val.trim() !== "" && !match) {
      info.style.display = "block";
    } else {
      info.style.display = "none";
    }
  }

  function handleFileSelect(event) {
    const file = event.target.files[0];
    const fileInfo = document.getElementById('fileInfo');
    if (file) {
      if (file.type !== "application/pdf") {
        alert("Harap unggah file berformat PDF!");
        event.target.value = "";
        fileInfo.innerText = "Belum ada file dipilih";
        return;
      }
      fileInfo.innerText = `📄 ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;
    } else {
      fileInfo.innerText = "Belum ada file dipilih";
    }
  }

  function convertFileToBase64(file) {
    return new Promise((resolve) => {
      if (!file) { resolve(""); return; }
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
    });
  }

  document.getElementById('formPermintaan').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const loading = document.getElementById('loadingStatus');
    btn.disabled = true;
    btn.innerText = "Memproses...";
    loading.style.display = "block";

    try {
      const fileInput = document.getElementById('lampiranFile');
      let base64File = "";
      let fileName = "";
      let mimeType = "application/pdf";

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        fileName = file.name;
        mimeType = file.type;
        base64File = await convertFileToBase64(file);
      }

      const payload = {
        action: "submitPermintaan",
        namaPemohon: sesiUser.nama,
        divisi: sesiUser.divisi,
        unitLokasi: sesiUser.unitLokasi,
        tglPermintaan: document.getElementById('tglPermintaan').value,
        tglDibutuhkan: document.getElementById('tglDibutuhkan').value,
        urgensi: document.getElementById('urgensi').value,
        kategori: document.getElementById('kategori').value,
        namaBarang: document.getElementById('namaBarang').value.trim(),
        jumlah: document.getElementById('jumlah').value,
        satuan: document.getElementById('satuan').value,
        supplier: document.getElementById('supplier').value.trim(),
        keterangan: document.getElementById('keterangan').value.trim(),
        fileName: fileName,
        mimeType: mimeType,
        fileData: base64File
      };

      const response = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if (result.status === "success") {
        alert("Permintaan berhasil dikirim dan master barang otomatis diperbarui!");
        document.getElementById('formPermintaan').reset();
        document.getElementById('tglPermintaan').value = new Date().toISOString().split('T')[0];
        document.getElementById('fileInfo').innerText = "Belum ada file dipilih";
        document.getElementById('infoBarangBaru').style.display = "none";
        muatMasterBarang();
      } else {
        alert("Gagal: " + result.message);
      }
    } catch (err) {
      console.error(err);
      alert("Terjadi kesalahan jaringan.");
    } finally {
      btn.disabled = false;
      btn.innerText = "Kirim Permintaan";
      loading.style.display = "none";
    }
  });
</script>

</body>
</html>
