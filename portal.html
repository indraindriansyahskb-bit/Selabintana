<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Permintaan Barang & Peralatan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin: auto;
      margin-bottom: 30px;
    }
    h2 {
      color: #333;
      text-align: center;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input[type="text"], select, textarea, input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
      height: 80px;
    }
    .preview-container {
      margin-top: 10px;
      text-align: center;
    }
    #imagePreview {
      max-width: 100%;
      max-height: 200px;
      display: none;
      border-radius: 6px;
      border: 1px solid #ddd;
      margin-top: 5px;
    }
    button {
      background-color: #28a745;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      font-weight: bold;
    }
    button:hover {
      background-color: #218838;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #loadingStatus {
      text-align: center;
      margin-top: 15px;
      font-style: italic;
      color: #007bff;
      display: none;
    }
    .filter-wrapper {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

<!-- KONTAINER FORMULIR PERMINTAAN -->
<div class="container">
  <h2>Form Permintaan Barang & Peralatan</h2>
  
  <form id="formPermintaan">
    <div class="form-group">
      <label for="namaPemohon">Nama Pemohon:</label>
      <input type="text" id="namaPemohon" required placeholder="Masukkan nama lengkap">
    </div>

    <div class="form-group">
      <label for="unitFarm">Unit Farm / Departemen:</label>
      <select id="unitFarm" required>
        <option value="">-- Pilih Unit Farm --</option>
        <option value="Farm Sukajaya">Farm Sukajaya</option>
        <option value="Farm Selabintana">Farm Selabintana</option>
        <option value="Hatchery Teras">Hatchery Teras</option>
        <option value="RPA Pasir Pin">RPA Pasir Pin</option>
      </select>
    </div>

    <div class="form-group">
      <label for="daftarBarang">Daftar Barang / Keperluan:</label>
      <textarea id="daftarBarang" required placeholder="Tuliskan rincian barang yang diminta..."></textarea>
    </div>

    <div class="form-group">
      <label for="lampiranFile">Unggah Foto / Bukti (Gambar):</label>
      <input type="file" id="lampiranFile" accept="image/png, image/jpeg, image/jpg" onchange="previewImage(event)" required>
      
      <div class="preview-container">
        <img id="imagePreview" alt="Pratinjau Gambar">
      </div>
    </div>

    <button type="submit" id="submitBtn">Kirim Permintaan</button>
    <div id="loadingStatus">Sedang memproses dan mengunggah data...</div>
  </form>
</div>

<!-- KONTAINER RIWAYAT & FILTER -->
<div class="container">
  <h2>Riwayat Permintaan Barang</h2>
  
  <div class="filter-wrapper">
    <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
      <label for="filterUnit">Filter Unit Farm:</label>
      <select id="filterUnit" onchange="jalankanFilter()">
        <option value="ALL">-- Tampilkan Semua Unit --</option>
        <option value="Farm Sukajaya">Farm Sukajaya</option>
        <option value="Farm Selabintana">Farm Selabintana</option>
        <option value="Hatchery Teras">Hatchery Teras</option>
        <option value="RPA Pasir Pin">RPA Pasir Pin</option>
      </select>
    </div>

    <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
      <label for="searchBox">Cari Pemohon / Barang:</label>
      <input type="text" id="searchBox" onkeyup="jalankanFilter()" placeholder="Ketik nama atau barang...">
    </div>
  </div>

  <div style="overflow-x: auto;">
    <table id="tabelRiwayat">
      <thead>
        <tr>
          <th>Waktu</th>
          <th>Pemohon</th>
          <th>Unit Farm</th>
          <th>Barang</th>
          <th>Lampiran</th>
        </tr>
      </thead>
      <tbody id="bodyRiwayat">
        <tr>
          <td colspan="5" style="text-align: center;">Memuat data riwayat...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // Ganti dengan URL Web App dari Google Apps Script kamu
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyXv7p4QS7P_6EmgNDT2hr9y3iQ4jaZo3L31o-NPB5A3lT6ZmicDfZnbVi0CF8p8OT8PQ/exec";

  let semuaDataRiwayat = [];

  // 1. Fungsi Pratinjau (Preview) Gambar
  function previewImage(event) {
    const fileInput = event.target;
    const previewImg = document.getElementById('imagePreview');
    
    if (fileInput.files && fileInput.files[0]) {
      const file = fileInput.files[0];
      
      if (!file.type.startsWith('image/')) {
        alert('Harap pilih file berformat gambar (JPG/PNG).');
        fileInput.value = '';
        previewImg.style.display = 'none';
        return;
      }
      
      const imageURL = URL.createObjectURL(file);
      previewImg.src = imageURL;
      previewImg.style.display = 'inline-block';
      
      previewImg.onload = function() {
        URL.revokeObjectURL(previewImg.src);
      }
    } else {
      previewImg.src = '#';
      previewImg.style.display = 'none';
    }
  }

  // 2. Fungsi Kompresi & Resize Gambar menggunakan Canvas
  function compressAndResizeImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.7) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > maxWidth || height > maxHeight) {
            if (width > height) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            } else {
              width = Math.round((width * maxHeight) / height);
              height = maxHeight;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(compressedDataUrl);
        };
        
        img.onerror = (error) => reject(error);
      };
      
      reader.onerror = (error) => reject(error);
    });
  }

  // 3. Muat Data Riwayat dari Google Apps Script
  async function muatDataRiwayat() {
    try {
      const response = await fetch(GAS_URL + "?action=getData");
      const result = await response.json();
      
      if (result.status === "success") {
        semuaDataRiwayat = result.data;
        tampilkanTabel(semuaDataRiwayat);
      }
    } catch (error) {
      console.error("Gagal memuat riwayat:", error);
      document.getElementById('bodyRiwayat').innerHTML = `<tr><td colspan="5" style="text-align: center; color: red;">Gagal memuat data dari server.</td></tr>`;
    }
  }

  // 4. Render Data ke Tabel
  function tampilkanTabel(data) {
    const tbody = document.getElementById('bodyRiwayat');
    tbody.innerHTML = "";
    
    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">Tidak ada data ditemukan.</td></tr>`;
      return;
    }
    
    data.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.timestamp}</td>
        <td>${item.namaPemohon}</td>
        <td>${item.unitFarm}</td>
        <td>${item.daftarBarang}</td>
        <td><a href="${item.fileUrl}" target="_blank">Lihat Gambar</a></td>
      `;
      tbody.appendChild(tr);
    });
  }

  // 5. Fungsi Filter (Unit Farm + Text Search)
  function jalankanFilter() {
    const selectedUnit = document.getElementById('filterUnit').value;
    const keyword = document.getElementById('searchBox').value.toLowerCase().trim();
    
    const filteredData = semuaDataRiwayat.filter(item => {
      const matchUnit = (selectedUnit === "ALL" || item.unitFarm === selectedUnit);
      const matchSearch = (
        String(item.namaPemohon).toLowerCase().includes(keyword) || 
        String(item.daftarBarang).toLowerCase().includes(keyword)
      );
      return matchUnit && matchSearch;
    });
    
    tampilkanTabel(filteredData);
  }

  // 6. Penanganan Submit Form
  document.getElementById('formPermintaan').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const fileInput = document.getElementById('lampiranFile');
    if (fileInput.files.length === 0) {
      alert("Harap unggah gambar terlebih dahulu!");
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    const loadingStatus = document.getElementById('loadingStatus');
    
    submitBtn.disabled = true;
    submitBtn.innerText = "Mengirim...";
    loadingStatus.style.display = "block";

    try {
      const originalFile = fileInput.files[0];
      const compressedBase64 = await compressAndResizeImage(originalFile, 1200, 1200, 0.7);
      
      const payload = {
        fileName: originalFile.name.replace(/\.[^/.]+$/, "") + ".jpg",
        mimeType: "image/jpeg",
        fileData: compressedBase64,
        namaPemohon: document.getElementById('namaPemohon').value,
        unitFarm: document.getElementById('unitFarm').value,
        daftarBarang: document.getElementById('daftarBarang').value
      };

      const response = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      
      const result = await response.json();
      
      if (result.status === "success") {
        alert("Berhasil! Permintaan dan gambar telah dikirim.");
        document.getElementById('formPermintaan').reset();
        document.getElementById('imagePreview').style.display = 'none';
        muatDataRiwayat(); // Muat ulang tabel riwayat
      } else {
        alert("Gagal: " + result.message);
      }
      
    } catch (error) {
      console.error("Error:", error);
      alert("Terjadi kesalahan jaringan atau server saat mengirim data.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Kirim Permintaan";
      loadingStatus.style.display = "none";
    }
  });

  // Muat data saat halaman pertama kali dibuka
  window.onload = function() {
    muatDataRiwayat();
  };
</script>

</body>
</html>
